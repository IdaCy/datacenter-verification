schema_version: "0.2"
created: "2026-05-16"
source_inventory: observables/observables.yaml
status: concrete_algorithm_rule_spec

core_training_features:
  allocation:
    - allocated_accelerator_count_by_sku
    - compute_running_intervals
  accelerator_activity:
    - tensor_matrix_mxu_neuron_or_engine_active_fraction
    - generic_achieved_operation_rate
    - accelerator_busy_or_utilization_fraction
  fabric_activity:
    - scaleout_port_tx_rx_bytes_packets
    - local_interconnect_tx_rx_bytes
    - fabric_port_device_sample_counters
    - rdma_congestion_retry_drop_error_counters
  storage_checkpoint_activity:
    - storage_write_operation_bytes
    - object_storage_operation_counts
    - filesystem_throughput_metadata_ops
  container_activity:
    - container_resource_usage_quantity
  serving_counterevidence:
    - load_balancer_gateway_flow_activity
    - north_south_external_egress
    - vpc_or_nsg_flow_records

concrete_trigger_policy:
  portability: mixed
  default_score_range: score_0_to_1
  default_time_alignment: clock_aligned_overlap_window
  policy_notes:
    - "The `1e25` operation threshold is source-backed as a policy review scale, not as a workload identity classifier."
    - "Positive training identity thresholds are executable calibration defaults. They are normalized to participants, aligned time, coverage, and capacity where possible."
    - "Strong training labels require at least one workload-shape channel beyond high accelerator activity, plus no active strong suppressor."
    - "Raw fabric bytes, raw storage bytes, and raw accelerator utilization never produce strong training evidence by themselves."

rule_families:
  - id: collective_cadence_training
  - id: checkpoint_training_signature
  - id: sustained_ml_compute_nonserving
  - id: achieved_ops_training_candidate

training_core_rules:
  - id: collective_cadence_training
    purpose: evidence_training
    required_features:
      - allocated_accelerator_count_by_sku
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - scaleout_port_tx_rx_bytes_packets
    alternate_required_features:
      allocation_window:
        - compute_running_intervals
      accelerator_activity:
        - generic_achieved_operation_rate
        - accelerator_busy_or_utilization_fraction
    derived_signals:
      - stable_participant_set
      - sustained_accelerator_activity_window
      - collective_cadence_score
      - fabric_compute_time_alignment
      - largest_usable_topology_domain
      - clock_aligned_overlap_window
      - checkpoint_periodicity_score
      - non_serving_score
      - telemetry_coverage_fraction
    supportive_features:
      - local_interconnect_tx_rx_bytes
      - fabric_port_device_sample_counters
      - rdma_congestion_retry_drop_error_counters
      - storage_write_operation_bytes
      - object_storage_operation_counts
      - filesystem_throughput_metadata_ops
      - container_resource_usage_quantity
    counterevidence_features:
      - load_balancer_gateway_flow_activity
      - north_south_external_egress
      - vpc_or_nsg_flow_records
    time_alignment: >
      Required allocation/running context, accelerator activity, and fabric
      activity must overlap in one clock-aligned window and map to the same
      participant set, job/container scope, or topology domain.
    trigger:
      type: threshold_logic_with_calibration_default
      portability: moderate
      evaluation_window: clock_aligned_overlap_window
      minimum_required_channels:
        - allocation_or_running
        - accelerator_activity
        - scaleout_or_local_fabric_activity
        - serving_counterevidence_or_declared_absence
      conditions:
        all:
          - metric: stable_participant_set.participant_count
            op: ">="
            value_ref: min_participants_weak
          - metric: clock_aligned_overlap_window.duration_seconds
            op: ">="
            value_ref: min_aligned_window_duration_seconds
          - metric: telemetry_coverage_fraction.primary_channel_min
            op: ">="
            value_ref: min_primary_coverage_fraction
          - metric: stable_participant_set.stability_score
            op: ">="
            value_ref: min_stability_score_weak
          - metric: stable_participant_set.churn_fraction
            op: "<="
            value_ref: max_churn_fraction_weak
          - metric: sustained_accelerator_activity_window.activity_score
            op: ">="
            value_ref: min_activity_score_weak
          - metric: fabric_compute_time_alignment.overlap_fraction
            op: ">="
            value_ref: min_compute_fabric_overlap_fraction_weak
          - metric: collective_cadence_score.cadence_score
            op: ">="
            value_ref: min_collective_cadence_score_weak
          - metric: collective_cadence_score.normalized_fabric_burst_score
            op: ">="
            value_ref: min_normalized_fabric_burst_score_weak
        any:
          - metric: collective_cadence_score.candidate_collective_types
            op: intersects
            value_ref: training_collective_type_set
          - metric: checkpoint_periodicity_score.periodicity_score
            op: ">="
            value_ref: min_support_checkpoint_score
        none:
          - metric: non_serving_score.serving_counterevidence_score
            op: ">="
            value_ref: serving_suppression_score
          - metric: collective_cadence_score.false_positive_penalty_score
            op: ">="
            value_ref: max_false_positive_penalty
      confidence_thresholds:
        weak:
          all:
            - metric: collective_cadence_score.cadence_score
              op: ">="
              value_ref: min_collective_cadence_score_weak
            - metric: sustained_accelerator_activity_window.activity_score
              op: ">="
              value_ref: min_activity_score_weak
        medium:
          all:
            - metric: stable_participant_set.participant_count
              op: ">="
              value_ref: min_participants_medium
            - metric: stable_participant_set.stability_score
              op: ">="
              value_ref: min_stability_score_medium
            - metric: stable_participant_set.churn_fraction
              op: "<="
              value_ref: max_churn_fraction_medium
            - metric: sustained_accelerator_activity_window.activity_score
              op: ">="
              value_ref: min_activity_score_medium
            - metric: fabric_compute_time_alignment.overlap_fraction
              op: ">="
              value_ref: min_compute_fabric_overlap_fraction_medium
            - metric: collective_cadence_score.cadence_score
              op: ">="
              value_ref: min_collective_cadence_score_medium
            - metric: non_serving_score.serving_counterevidence_score
              op: "<="
              value_ref: max_serving_counterevidence_for_medium
        strong:
          all:
            - metric: stable_participant_set.participant_count
              op: ">="
              value_ref: min_participants_strong
            - metric: clock_aligned_overlap_window.duration_seconds
              op: ">="
              value_ref: min_strong_window_duration_seconds
            - metric: telemetry_coverage_fraction.primary_channel_min
              op: ">="
              value_ref: min_strong_coverage_fraction
            - metric: stable_participant_set.stability_score
              op: ">="
              value_ref: min_stability_score_strong
            - metric: stable_participant_set.churn_fraction
              op: "<="
              value_ref: max_churn_fraction_strong
            - metric: sustained_accelerator_activity_window.activity_score
              op: ">="
              value_ref: min_activity_score_strong
            - metric: fabric_compute_time_alignment.overlap_fraction
              op: ">="
              value_ref: min_compute_fabric_overlap_fraction_strong
            - metric: collective_cadence_score.cadence_score
              op: ">="
              value_ref: min_collective_cadence_score_strong
            - metric: collective_cadence_score.normalized_fabric_burst_score
              op: ">="
              value_ref: min_normalized_fabric_burst_score_strong
            - metric: non_serving_score.serving_counterevidence_score
              op: "<="
              value_ref: max_serving_counterevidence_for_strong
          any:
            - metric: checkpoint_periodicity_score.periodicity_score
              op: ">="
              value_ref: min_support_checkpoint_score
            - metric: largest_usable_topology_domain.domain_accelerator_count
              op: ">="
              value_ref: min_participants_strong
      suppression_conditions:
        - id: serving_heavy_network_shape
          metric: non_serving_score.serving_counterevidence_score
          op: ">="
          value_ref: serving_suppression_score
          suppresses_confidence_at_or_above: medium
        - id: benchmark_or_hpc_collective_shape
          metric: collective_cadence_score.false_positive_penalty_score
          op: ">="
          value_ref: benchmark_hpc_suppression_score
          suppresses_confidence_at_or_above: strong
        - id: storage_or_backup_explanation
          metric: collective_cadence_score.storage_explanation_overlap_fraction
          op: ">="
          value_ref: storage_explanation_suppression_overlap_fraction
          suppresses_confidence_at_or_above: medium
      confidence_mapping:
        weak: "Required channels pass weak thresholds; useful as a distributed-training review candidate only."
        medium: "Participant, activity, cadence, overlap, and non-serving thresholds pass with no medium suppressor."
        strong: "Medium conditions plus stronger scale, duration, coverage, stability, normalized fabric, and at least one checkpoint/topology support condition pass with no suppressor."
      calibration_defaults:
        - name: min_participants_weak
          value: 8
          unit: participants
          evidence_status: calibration_default
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Executable lower bound for multi-device collective review after excluding single-host noise; exact participant count is not portable."
          counterevidence_or_failure_modes: ["single-node or small fine-tuning can be true training below this count", "NCCL/MPI tests and inference shards can exceed it"]
          calibration_note: "Replace with local participant-count distributions for training, inference, HPC, burn-in, and benchmark jobs."
        - name: min_participants_medium
          value: 16
          unit: participants
          evidence_status: calibration_default
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Initial multi-node review threshold for stable synchronized collective patterns."
          counterevidence_or_failure_modes: ["large inference, HPC/MPI, and communication benchmarks can satisfy this scale"]
          calibration_note: "Calibrate per topology generation, scheduler shape, and workload class."
        - name: min_participants_strong
          value: 64
          unit: participants
          evidence_status: calibration_default
          source_refs: [S15, S16, S17, S25]
          rationale: "Large synchronized footprint default for strong distributed-training evidence when joined with cadence and activity."
          counterevidence_or_failure_modes: ["large HPC and benchmark allocations can have larger stable participant sets"]
          calibration_note: "Replace using site distributions of large training, inference, benchmark, and HPC allocations."
        - name: min_aligned_window_duration_seconds
          value: 1800
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S12, S13, S14, S16, S17]
          rationale: "Filters short tests while preserving candidate generation for sustained step-like activity."
          counterevidence_or_failure_modes: ["short fine-tunes can be real training", "long-running benchmarks can pass"]
          calibration_note: "Set from local job-duration distributions and collector aggregation intervals."
        - name: min_strong_window_duration_seconds
          value: 21600
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S16, S17]
          rationale: "Strong label default requires persistence beyond typical smoke tests and short benchmarks."
          counterevidence_or_failure_modes: ["scheduled burn-in or HPC runs can be long", "large bursty fine-tuning can be shorter"]
          calibration_note: "Tune from confirmed workload durations."
        - name: min_primary_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          source_refs: [S07, S08, S28, S29, S30, S42, S43]
          rationale: "Provider and fabric docs expose telemetry surfaces but warn about sampling, aggregation, and missingness; require most of the window covered."
          counterevidence_or_failure_modes: ["best-effort or sampled logs can under-cover active traffic", "collector gaps can produce false negatives"]
          calibration_note: "Replace with measured per-channel coverage and aggregation-delay behavior."
        - name: min_strong_coverage_fraction
          value: 0.95
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S07, S08, S28, S29, S30, S42, S43]
          rationale: "Strong labels require near-complete primary telemetry coverage."
          counterevidence_or_failure_modes: ["some provider logs cannot reliably reach this coverage", "offline buffered telemetry can arrive late"]
          calibration_note: "Set per telemetry source after accounting for delivery delay and sampling."
        - name: min_stability_score_weak
          value: 0.65
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S12, S13, S14, S16, S17]
          rationale: "Allows early review of coordinated participant sets while requiring more than incidental overlap."
          counterevidence_or_failure_modes: ["elastic training and preemption can lower score", "static HPC jobs can raise score"]
          calibration_note: "Calibrate against local participant churn and elastic-job behavior."
        - name: min_stability_score_medium
          value: 0.80
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S12, S13, S14, S16, S17]
          rationale: "Medium evidence should have a coherent participant set across most of the window."
          counterevidence_or_failure_modes: ["rescheduling, elastic training, or topology remaps can depress real training"]
          calibration_note: "Tune from scheduler and fabric mapping accuracy."
        - name: min_stability_score_strong
          value: 0.90
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S12, S13, S14, S16, S17]
          rationale: "Strong collective evidence needs a highly stable footprint."
          counterevidence_or_failure_modes: ["highly elastic or fault-tolerant training can be real below this value"]
          calibration_note: "Replace with site-specific stable participant distributions."
        - name: max_churn_fraction_weak
          value: 0.25
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S18, S21, S22]
          rationale: "Allows limited lifecycle churn while filtering unrelated traffic aggregation."
          counterevidence_or_failure_modes: ["preemption-heavy training may exceed this", "static non-training jobs may be below this"]
          calibration_note: "Calibrate by scheduler lifecycle and preemption rates."
        - name: max_churn_fraction_medium
          value: 0.15
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S18, S21, S22]
          rationale: "Medium evidence should keep most participants through the same aligned window."
          counterevidence_or_failure_modes: ["elastic training can churn more", "HPC can churn less"]
          calibration_note: "Tune per scheduler and elastic workload policy."
        - name: max_churn_fraction_strong
          value: 0.05
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S18, S21, S22]
          rationale: "Strong evidence requires nearly fixed participant membership."
          counterevidence_or_failure_modes: ["failures or rolling restarts can create false downgrades"]
          calibration_note: "Replace with confirmed training-run churn distribution."
        - name: min_activity_score_weak
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Requires meaningful accelerator activity after normalizing tensor-active, achieved-rate, or busy channels."
          counterevidence_or_failure_modes: ["memory-bound training can score lower", "inference, HPC, and benchmarks can score higher"]
          calibration_note: "Calibrate from hardware-specific activity counters and known workloads."
        - name: min_activity_score_medium
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Medium evidence should show sustained high normalized accelerator activity."
          counterevidence_or_failure_modes: ["communication-bound training may be below this", "dense inference can exceed it"]
          calibration_note: "Replace with local tensor/achieved/busy distributions by workload."
        - name: min_activity_score_strong
          value: 0.80
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Strong evidence should show sustained accelerator use consistent with high-utilization model development."
          counterevidence_or_failure_modes: ["input-bound or communication-bound training can score lower"]
          calibration_note: "Tune by accelerator family and parallelism strategy."
        - name: min_compute_fabric_overlap_fraction_weak
          value: 0.45
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Collective-like traffic should occur during a material part of active compute time."
          counterevidence_or_failure_modes: ["pipeline bubbles, checkpoint pauses, and async collectives can reduce overlap"]
          calibration_note: "Tune by framework, pipeline schedule, and sampling interval."
        - name: min_compute_fabric_overlap_fraction_medium
          value: 0.65
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Medium evidence should have clearly time-aligned fabric and accelerator activity."
          counterevidence_or_failure_modes: ["coarse aggregation can blur overlap", "HPC collectives can also pass"]
          calibration_note: "Calibrate with step-level or fabric-counter traces when available."
        - name: min_compute_fabric_overlap_fraction_strong
          value: 0.80
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Strong evidence requires fabric bursts to be tightly coupled to compute."
          counterevidence_or_failure_modes: ["coarse flow logs can make this unavailable", "some parallelism strategies communicate in concentrated phases"]
          calibration_note: "Replace with local trace-calibrated overlap distributions."
        - name: min_collective_cadence_score_weak
          value: 0.50
          unit: score_0_to_1
          evidence_status: mechanism_inferred
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "NCCL/DDP/FSDP/ZeRO mechanisms support repeated collective-like structure; threshold is an executable initial detector."
          counterevidence_or_failure_modes: ["HPC/MPI and NCCL tests can be highly collective-like"]
          calibration_note: "Calibrate cadence score components from confirmed traces."
        - name: min_collective_cadence_score_medium
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Medium evidence should show repeated, synchronized, byte-consistent bursts."
          counterevidence_or_failure_modes: ["benchmarks and HPC can produce cleaner cadence than training"]
          calibration_note: "Tune using false-positive workload traces."
        - name: min_collective_cadence_score_strong
          value: 0.85
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Strong evidence requires very clear collective-like structure joined with other channels."
          counterevidence_or_failure_modes: ["communication benchmarks can exceed this without training"]
          calibration_note: "Require site-calibrated false-positive thresholds before operational strong claims."
        - name: min_normalized_fabric_burst_score_weak
          value: 0.40
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S11, S15, S16, S17, S42, S43]
          rationale: "Avoids raw byte thresholds by normalizing bursts per participant, cadence period, and fabric capacity."
          counterevidence_or_failure_modes: ["model size, parallelism, and fabric generation materially change normalized burst scores"]
          calibration_note: "Replace with local normalized fabric-score distributions."
        - name: min_normalized_fabric_burst_score_strong
          value: 0.75
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S11, S15, S16, S17, S42, S43]
          rationale: "Strong evidence should show material normalized fabric movement, not only tiny synchronized messages."
          counterevidence_or_failure_modes: ["small models or heavy data-parallel overlap can be below this", "benchmarks can exceed it"]
          calibration_note: "Calibrate per fabric generation, model family, and parallelism."
        - name: training_collective_type_set
          value: [AllReduce, ReduceScatter, AllGather, Broadcast, collective_like_unknown]
          unit: categorical_set
          evidence_status: source_backed
          source_refs: [S11, S12, S13, S14]
          rationale: "These collective families are directly tied to common distributed training mechanisms."
          counterevidence_or_failure_modes: ["The same collectives are also used by HPC and communication benchmarks."]
          calibration_note: "Site-specific classifiers should refine collective type inference from counters, libraries, or packet metadata."
        - name: min_support_checkpoint_score
          value: 0.55
          unit: score_0_to_1
          evidence_status: source_informed
          source_refs: [S31, S32, S33, S45, S46, S47]
          rationale: "Checkpoint-like repeated writes strengthen but do not define distributed training."
          counterevidence_or_failure_modes: ["backups, replication, snapshots, ETL exports, and generated data can mimic write bursts"]
          calibration_note: "Replace with local checkpoint policy and storage-operation labels."
        - name: max_serving_counterevidence_for_medium
          value: 0.45
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Medium training evidence should have limited serving-like request or egress shape."
          counterevidence_or_failure_modes: ["training jobs may fetch data or export artifacts externally", "offline batch inference can have low serving score"]
          calibration_note: "Calibrate against local serving and batch-inference network traces."
        - name: max_serving_counterevidence_for_strong
          value: 0.25
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Strong training evidence should not coincide with strong serving-shape traffic."
          counterevidence_or_failure_modes: ["mixed workloads and gateway aggregation can inflate serving score"]
          calibration_note: "Tune by network boundary, load balancer architecture, and service mesh."
        - name: serving_suppression_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "High serving counterevidence should suppress training labels unless independently explained."
          counterevidence_or_failure_modes: ["synthetic data generation or artifact export can appear external"]
          calibration_note: "Set from known inference/serving windows and external-data workflows."
        - name: benchmark_hpc_suppression_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S11, S15, S16, S17, S25]
          rationale: "Strong benchmark/HPC alternative evidence should prevent a strong training label from fabric cadence alone."
          counterevidence_or_failure_modes: ["some training traces resemble synthetic benchmarks in short windows"]
          calibration_note: "Calibrate with known NCCL, MPI, HPC, and burn-in runs."
        - name: storage_explanation_suppression_overlap_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          source_refs: [S31, S32, S33, S34, S35]
          rationale: "A storage operation explaining most of the same window should suppress fabric/storage-based training interpretations."
          counterevidence_or_failure_modes: ["storage operations can overlap real training input or checkpoint writes"]
          calibration_note: "Tune using storage operation labels and bytes-explained accounting."
        - name: max_false_positive_penalty
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S11, S15, S16, S17, S25, S31, S32, S33]
          rationale: "Prevents a positive trigger when known alternatives explain most of the same signal."
          counterevidence_or_failure_modes: ["false-positive classifiers can over-penalize mixed training/storage windows"]
          calibration_note: "Calibrate penalty weights against confirmed alternatives."
    decision_logic:
      - condition: "stable participant set, sustained accelerator activity, collective cadence, normalized fabric movement, and compute/fabric overlap pass explicit thresholds"
      - condition: "raw fabric bytes are never sufficient; byte features must enter through normalized derived scores"
      - condition: "serving, benchmark, HPC, and storage-operation alternatives are suppressors or confidence downgrades"
    output:
      label: training_evidence
      confidence_scale: [weak, medium, strong]
      fields:
        - candidate_window
        - participant_count
        - stability_score
        - collective_cadence_score
        - normalized_fabric_burst_score
        - fabric_compute_alignment_score
        - supportive_checkpoint_score
        - counterevidence_summary
    confidence_label: likely
    evidence_status: source_informed
    source_refs: [S11, S12, S13, S14, S15, S16, S17, S25, S42, S43]

  - id: checkpoint_training_signature
    purpose: evidence_training
    required_features:
      - storage_write_operation_bytes
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
    alternate_required_features:
      write_channel:
        - object_storage_operation_counts
        - filesystem_throughput_metadata_ops
      allocation_window:
        - allocated_accelerator_count_by_sku
        - compute_running_intervals
      activity_channel:
        - generic_achieved_operation_rate
        - accelerator_busy_or_utilization_fraction
    derived_signals:
      - checkpoint_periodicity_score
      - checkpoint_size_consistency
      - sustained_accelerator_activity_window
      - clock_aligned_overlap_window
      - telemetry_coverage_fraction
    supportive_features:
      - object_storage_operation_counts
      - filesystem_throughput_metadata_ops
      - container_resource_usage_quantity
    counterevidence_features:
      - load_balancer_gateway_flow_activity
      - north_south_external_egress
      - vpc_or_nsg_flow_records
      - storage_operation_intervals
      - object_or_file_copy_movement_records
    time_alignment: >
      Checkpoint-like writes must occur during, immediately after, or at
      repeated intervals inside a stable accelerator activity window.
    trigger:
      type: threshold_logic_with_calibration_default
      portability: weak
      reason: "Checkpoint size and period depend on model family, optimizer state, framework, storage layout, and checkpoint policy."
      evaluation_window: clock_aligned_overlap_window
      minimum_required_channels:
        - storage_write_or_object_write_activity
        - accelerator_activity
        - allocation_or_running_context
        - storage_operation_counterevidence_or_declared_absence
      conditions:
        all:
          - metric: checkpoint_periodicity_score.write_burst_count
            op: ">="
            value_ref: minimum_checkpoint_burst_count
          - metric: checkpoint_periodicity_score.periodicity_score
            op: ">="
            value_ref: min_checkpoint_periodicity_score
          - metric: checkpoint_size_consistency.size_consistency_score
            op: ">="
            value_ref: min_checkpoint_size_consistency_score
          - metric: checkpoint_size_consistency.coefficient_of_variation
            op: "<="
            value_ref: max_checkpoint_size_cv
          - metric: checkpoint_size_consistency.normalized_checkpoint_size_score
            op: ">="
            value_ref: min_normalized_checkpoint_size_score
          - metric: sustained_accelerator_activity_window.activity_score
            op: ">="
            value_ref: min_activity_score_for_checkpoint
          - metric: checkpoint_periodicity_score.activity_overlap_or_adjacency_fraction
            op: ">="
            value_ref: min_checkpoint_activity_overlap_or_adjacency_fraction
          - metric: telemetry_coverage_fraction.primary_channel_min
            op: ">="
            value_ref: min_primary_coverage_fraction
        any:
          - metric: checkpoint_size_consistency.expected_range_source
            op: in
            value_ref: acceptable_checkpoint_size_range_sources
          - metric: checkpoint_periodicity_score.write_burst_count
            op: ">="
            value_ref: strong_checkpoint_burst_count
        none:
          - metric: checkpoint_periodicity_score.storage_operation_explanation_overlap_fraction
            op: ">="
            value_ref: storage_operation_suppression_overlap_fraction
          - metric: checkpoint_periodicity_score.single_write_only
            op: "=="
            value: true
      confidence_thresholds:
        weak:
          all:
            - metric: checkpoint_periodicity_score.write_burst_count
              op: ">="
              value_ref: minimum_checkpoint_burst_count
            - metric: checkpoint_periodicity_score.periodicity_score
              op: ">="
              value_ref: min_checkpoint_periodicity_score
        medium:
          all:
            - metric: checkpoint_periodicity_score.write_burst_count
              op: ">="
              value_ref: medium_checkpoint_burst_count
            - metric: checkpoint_size_consistency.coefficient_of_variation
              op: "<="
              value_ref: max_checkpoint_size_cv
            - metric: checkpoint_periodicity_score.activity_overlap_or_adjacency_fraction
              op: ">="
              value_ref: min_checkpoint_activity_overlap_or_adjacency_fraction
        strong:
          all:
            - metric: checkpoint_periodicity_score.write_burst_count
              op: ">="
              value_ref: strong_checkpoint_burst_count
            - metric: checkpoint_periodicity_score.periodicity_score
              op: ">="
              value_ref: strong_checkpoint_periodicity_score
            - metric: checkpoint_size_consistency.coefficient_of_variation
              op: "<="
              value_ref: strong_checkpoint_size_cv
            - metric: sustained_accelerator_activity_window.duration_seconds
              op: ">="
              value_ref: min_activity_duration_for_strong_checkpoint_seconds
          any:
            - metric: checkpoint_size_consistency.expected_range_source
              op: "=="
              value: trainable_state_model
            - metric: checkpoint_size_consistency.expected_range_source
              op: "=="
              value: site_calibrated_checkpoint_policy
      suppression_conditions:
        - id: storage_operation_interval_explains_writes
          metric: checkpoint_periodicity_score.storage_operation_explanation_overlap_fraction
          op: ">="
          value_ref: storage_operation_suppression_overlap_fraction
          suppresses_confidence_at_or_above: medium
        - id: one_large_write_only
          metric: checkpoint_periodicity_score.single_write_only
          op: "=="
          value: true
          suppresses_confidence_at_or_above: weak
      confidence_mapping:
        weak: "Repeated write bursts are adjacent to accelerator activity but size or policy support is weak."
        medium: "Repeated checkpoint-like writes, consistent size, and activity adjacency pass defaults with no storage-operation suppressor."
        strong: "Medium conditions plus stronger burst count, periodicity, size consistency, and model/policy-backed expected size range."
      calibration_defaults:
        - name: minimum_checkpoint_burst_count
          value: 2
          unit: bursts
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "One large write can be export, backup, or artifact movement; at least two bursts are required for an executable checkpoint pattern."
          counterevidence_or_failure_modes: ["single final checkpoint after a short run can be real training", "periodic backup can produce many bursts"]
          calibration_note: "Replace with site framework checkpoint policy and model family behavior."
        - name: medium_checkpoint_burst_count
          value: 3
          unit: bursts
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Three bursts make periodicity and size consistency measurable."
          counterevidence_or_failure_modes: ["short training runs may only save two checkpoints", "backup rotations may save more than three"]
          calibration_note: "Tune by local checkpoint interval and job duration."
        - name: strong_checkpoint_burst_count
          value: 4
          unit: bursts
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Strong checkpoint evidence should show repeated lifecycle behavior, not an isolated storage event."
          counterevidence_or_failure_modes: ["long storage replication jobs can exceed this count"]
          calibration_note: "Calibrate with confirmed checkpoint and backup traces."
        - name: min_checkpoint_periodicity_score
          value: 0.60
          unit: score_0_to_1
          evidence_status: mechanism_inferred
          source_refs: [S45, S46, S47]
          rationale: "Training checkpoints are commonly repeated by policy or step/time interval; exact regularity is workload-specific."
          counterevidence_or_failure_modes: ["preemption or manual saves can be irregular", "scheduled backups can be periodic"]
          calibration_note: "Replace with local checkpoint scheduler policy."
        - name: strong_checkpoint_periodicity_score
          value: 0.80
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Strong checkpoint signature should have clear recurring timing after accounting for preemption/restart."
          counterevidence_or_failure_modes: ["irregular validation or preemption checkpoints can be real"]
          calibration_note: "Tune by framework and operator checkpoint policy."
        - name: min_checkpoint_size_consistency_score
          value: 0.60
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Repeated model-state saves should be more size-consistent than arbitrary storage writes, but sharding and policy vary."
          counterevidence_or_failure_modes: ["incremental checkpoints can vary", "backup snapshots can be consistent"]
          calibration_note: "Replace with measured checkpoint size distributions by model family."
        - name: max_checkpoint_size_cv
          value: 0.35
          unit: coefficient_of_variation
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Allows variation from sharding, metadata, optimizer state, and retention while filtering highly irregular exports."
          counterevidence_or_failure_modes: ["incremental/delta checkpoints can exceed this", "scheduled backups can be below it"]
          calibration_note: "Calibrate coefficient of variation by checkpoint implementation."
        - name: strong_checkpoint_size_cv
          value: 0.20
          unit: coefficient_of_variation
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Strong checkpoint evidence should have tighter repeated-size behavior unless an explicit policy explains variation."
          counterevidence_or_failure_modes: ["optimizer-state transitions can change size", "deduplicated backup can be tightly consistent"]
          calibration_note: "Tune with full, sharded, and incremental checkpoint families."
        - name: min_normalized_checkpoint_size_score
          value: 0.40
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S31, S32, S33, S45, S46, S47]
          rationale: "Uses normalized size relative to participant memory or expected trainable state instead of raw bytes."
          counterevidence_or_failure_modes: ["small fine-tunes and adapter training can be smaller", "storage migration can be large"]
          calibration_note: "Replace with local model-state and optimizer-state size estimates."
        - name: min_activity_score_for_checkpoint
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Checkpoint evidence must be joined to actual accelerator activity."
          counterevidence_or_failure_modes: ["checkpoint writes can occur after activity has paused", "storage-only workflows can mimic writes"]
          calibration_note: "Tune against lagged checkpoint writes and telemetry aggregation."
        - name: min_checkpoint_activity_overlap_or_adjacency_fraction
          value: 0.50
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Allows writes during or near active compute, including brief checkpoint pauses."
          counterevidence_or_failure_modes: ["final checkpoint after job end may have low overlap", "backups during compute can overlap"]
          calibration_note: "Set adjacency and overlap behavior from local framework logs."
        - name: min_activity_duration_for_strong_checkpoint_seconds
          value: 14400
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Strong checkpoint evidence should be embedded in sustained activity, not only short storage tests."
          counterevidence_or_failure_modes: ["short fine-tuning can be real training"]
          calibration_note: "Calibrate by workload duration and checkpoint cadence."
        - name: min_primary_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          source_refs: [S31, S32, S33, S34, S35]
          rationale: "Storage and audit logs can be delayed or best-effort, so covered intervals must be explicit."
          counterevidence_or_failure_modes: ["best-effort storage logs can miss events", "billing/audit aggregation can arrive late"]
          calibration_note: "Replace with measured storage-log coverage and delay."
        - name: storage_operation_suppression_overlap_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          source_refs: [S31, S32, S33, S34, S35]
          rationale: "A documented backup, restore, replication, rebuild, migration, or ETL interval explaining most writes should suppress checkpoint evidence."
          counterevidence_or_failure_modes: ["training may checkpoint to storage during unrelated storage maintenance"]
          calibration_note: "Tune with bytes-explained accounting and operation labels."
        - name: acceptable_checkpoint_size_range_sources
          value: [trainable_state_model, site_calibrated_checkpoint_policy, repeated_size_consistency]
          unit: categorical_set
          evidence_status: source_informed
          source_refs: [S45, S46, S47]
          rationale: "A size claim is strongest when tied to model/optimizer state, policy, or repeated consistency."
          counterevidence_or_failure_modes: ["state partitioning, optimizer offload, and retention policy alter size"]
          calibration_note: "Populate expected ranges from framework config and confirmed jobs."
    decision_logic:
      - condition: "at least two large normalized write bursts recur; one large write is insufficient"
      - condition: "write sizes are consistent or match a trainable-state checkpoint model"
      - condition: "writes overlap or are adjacent to sustained accelerator activity"
      - condition: "backup, restore, rebuild, replication, migration, and ETL intervals are checked as suppressors"
    output:
      label: training_evidence
      confidence_scale: [weak, medium, strong]
      fields:
        - candidate_window
        - write_burst_count
        - checkpoint_periodicity_score
        - checkpoint_size_consistency
        - normalized_checkpoint_size_score
        - activity_overlap_or_adjacency_fraction
        - counterevidence_summary
    confidence_label: likely
    evidence_status: source_informed
    source_refs: [S31, S32, S33, S34, S35, S45, S46, S47]

  - id: sustained_ml_compute_nonserving
    purpose: evidence_training_like_model_development
    required_features:
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - accelerator_busy_or_utilization_fraction
      - load_balancer_gateway_flow_activity
    alternate_required_features:
      activity_channel:
        - generic_achieved_operation_rate
      allocation_window:
        - allocated_accelerator_count_by_sku
        - compute_running_intervals
      serving_channel:
        - north_south_external_egress
        - vpc_or_nsg_flow_records
    derived_signals:
      - sustained_accelerator_activity_window
      - stable_participant_set
      - fabric_compute_time_alignment
      - non_serving_score
      - telemetry_coverage_fraction
    supportive_features:
      - scaleout_port_tx_rx_bytes_packets
      - local_interconnect_tx_rx_bytes
      - container_resource_usage_quantity
      - storage_write_operation_bytes
      - object_storage_operation_counts
      - filesystem_throughput_metadata_ops
    counterevidence_features:
      - load_balancer_gateway_flow_activity
      - north_south_external_egress
      - vpc_or_nsg_flow_records
    time_alignment: >
      High accelerator activity, allocation/running context, and low-serving
      network shape must overlap after clock alignment and scope mapping.
    trigger:
      type: candidate_generator_threshold_logic
      portability: moderate
      evaluation_window: clock_aligned_overlap_window
      minimum_required_channels:
        - accelerator_activity
        - allocation_or_running_context
        - serving_counterevidence_or_declared_absence
      conditions:
        all:
          - metric: sustained_accelerator_activity_window.duration_seconds
            op: ">="
            value_ref: min_sustained_activity_duration_seconds
          - metric: sustained_accelerator_activity_window.coverage_fraction
            op: ">="
            value_ref: min_activity_coverage_fraction
          - metric: sustained_accelerator_activity_window.activity_score
            op: ">="
            value_ref: min_activity_score
          - metric: non_serving_score.non_serving_score
            op: ">="
            value_ref: min_non_serving_score
          - metric: non_serving_score.serving_counterevidence_score
            op: "<="
            value_ref: max_serving_counterevidence_score
        any:
          - metric: stable_participant_set.participant_count
            op: ">="
            value_ref: min_participants
          - metric: sustained_accelerator_activity_window.accelerator_hours
            op: ">="
            value_ref: min_accelerator_hours
        none:
          - metric: non_serving_score.serving_counterevidence_score
            op: ">="
            value_ref: serving_suppression_score
      confidence_thresholds:
        weak:
          all:
            - metric: sustained_accelerator_activity_window.activity_score
              op: ">="
              value_ref: min_activity_score
            - metric: non_serving_score.non_serving_score
              op: ">="
              value_ref: min_non_serving_score
        medium:
          all:
            - metric: sustained_accelerator_activity_window.duration_seconds
              op: ">="
              value_ref: medium_sustained_activity_duration_seconds
            - metric: sustained_accelerator_activity_window.activity_score
              op: ">="
              value_ref: medium_activity_score
            - metric: telemetry_coverage_fraction.primary_channel_min
              op: ">="
              value_ref: medium_coverage_fraction
            - metric: sustained_accelerator_activity_window.support_channel_count
              op: ">="
              value_ref: medium_required_support_channel_count
        strong:
          all:
            - metric: sustained_accelerator_activity_window.duration_seconds
              op: ">="
              value_ref: strong_sustained_activity_duration_seconds
            - metric: sustained_accelerator_activity_window.activity_score
              op: ">="
              value_ref: strong_activity_score
            - metric: stable_participant_set.participant_count
              op: ">="
              value_ref: strong_min_participants
            - metric: sustained_accelerator_activity_window.support_channel_count
              op: ">="
              value_ref: strong_required_support_channel_count
            - metric: non_serving_score.serving_counterevidence_score
              op: "<="
              value_ref: strong_max_serving_counterevidence_score
      suppression_conditions:
        - id: serving_heavy_shape
          metric: non_serving_score.serving_counterevidence_score
          op: ">="
          value_ref: serving_suppression_score
          suppresses_confidence_at_or_above: medium
      confidence_mapping:
        weak: "Sustained non-serving accelerator activity candidate; not proof of training."
        medium: "Sustained non-serving activity plus at least one supporting channel such as fabric, checkpoint, topology, memory, or physical support."
        strong: "Large, long-running non-serving activity with two or more support channels and weak serving counterevidence; still labeled training-like unless core identity evidence also passes."
      calibration_defaults:
        - name: min_sustained_activity_duration_seconds
          value: 3600
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Filters transient bursts while preserving candidate generation."
          counterevidence_or_failure_modes: ["short fine-tunes or evaluation runs can be real model development", "long HPC and inference jobs can pass"]
          calibration_note: "Replace with local job-duration and workload-label distributions."
        - name: medium_sustained_activity_duration_seconds
          value: 14400
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Medium confidence should require several hours of sustained activity."
          counterevidence_or_failure_modes: ["large inference and HPC can be sustained"]
          calibration_note: "Calibrate by workload and accelerator family."
        - name: strong_sustained_activity_duration_seconds
          value: 43200
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Strong non-serving candidate should be persistent enough to warrant large-run review."
          counterevidence_or_failure_modes: ["batch inference, synthetic data generation, and HPC can also run this long"]
          calibration_note: "Tune with confirmed training-like and non-training long jobs."
        - name: min_activity_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Activity counters are only useful when most of the candidate window is covered."
          counterevidence_or_failure_modes: ["counter gaps can hide activity or create false absence of serving"]
          calibration_note: "Replace with collector-specific scrape and delivery coverage."
        - name: medium_coverage_fraction
          value: 0.90
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Medium labels need high activity and serving-channel coverage."
          counterevidence_or_failure_modes: ["some telemetry surfaces are sampled or delayed"]
          calibration_note: "Tune per telemetry source."
        - name: min_activity_score
          value: 0.55
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Candidate generation requires meaningful normalized accelerator activity."
          counterevidence_or_failure_modes: ["memory-bound training can score lower", "inference/HPC can score higher"]
          calibration_note: "Replace with hardware-specific activity score distributions."
        - name: medium_activity_score
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Medium candidate should show high sustained normalized accelerator activity."
          counterevidence_or_failure_modes: ["communication-bound training can be lower"]
          calibration_note: "Calibrate from known workloads."
        - name: strong_activity_score
          value: 0.80
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Strong candidate requires high sustained accelerator activity plus support."
          counterevidence_or_failure_modes: ["large inference and benchmarks can pass"]
          calibration_note: "Tune by accelerator and precision/mode."
        - name: min_non_serving_score
          value: 0.55
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "The rule is a non-serving candidate generator, so serving-like network evidence must be limited."
          counterevidence_or_failure_modes: ["batch inference can look non-serving", "training data fetch/export can look serving-like"]
          calibration_note: "Calibrate against local serving, batch inference, and training network traces."
        - name: max_serving_counterevidence_score
          value: 0.45
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Medium non-serving interpretation should have low serving evidence."
          counterevidence_or_failure_modes: ["load balancer aggregation and service mesh can misattribute traffic"]
          calibration_note: "Tune per network telemetry architecture."
        - name: strong_max_serving_counterevidence_score
          value: 0.25
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Strong candidate should have very weak serving counterevidence."
          counterevidence_or_failure_modes: ["artifact export or data staging can inflate external traffic"]
          calibration_note: "Calibrate against non-serving data lifecycle jobs."
        - name: serving_suppression_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Strong serving shape should suppress non-serving compute labels."
          counterevidence_or_failure_modes: ["mixed training/serving clusters can trigger suppressor on shared gateways"]
          calibration_note: "Tune from confirmed inference and serving windows."
        - name: min_participants
          value: 4
          unit: participants
          evidence_status: calibration_default
          source_refs: [S18, S19, S20]
          rationale: "Allows small distributed candidates while requiring either participant scale or accelerator-hours."
          counterevidence_or_failure_modes: ["single-device training is below this", "small inference services can exceed it"]
          calibration_note: "Replace with local model-development allocation sizes."
        - name: strong_min_participants
          value: 64
          unit: participants
          evidence_status: calibration_default
          source_refs: [S15, S16, S17]
          rationale: "Strong non-serving large-run candidate should have a large participant footprint."
          counterevidence_or_failure_modes: ["large HPC and inference can pass"]
          calibration_note: "Tune by local large workload classes."
        - name: min_accelerator_hours
          value: 64
          unit: accelerator_hours
          evidence_status: calibration_default
          source_refs: [S18, S23, S24, S26, S35]
          rationale: "Catches smaller participant counts that run long enough to merit review."
          counterevidence_or_failure_modes: ["long inference, batch, or HPC jobs can pass"]
          calibration_note: "Replace with accelerator-hour distributions and policy review scale."
        - name: medium_required_support_channel_count
          value: 1
          unit: channels
          evidence_status: project_assumption
          source_refs: [S11, S31, S40, S42]
          rationale: "Medium training-like label needs one corroborating non-serving support channel."
          counterevidence_or_failure_modes: ["support channels can be missing in sparse telemetry"]
          calibration_note: "Set by local channel reliability and false-positive rate."
        - name: strong_required_support_channel_count
          value: 2
          unit: channels
          evidence_status: project_assumption
          source_refs: [S11, S31, S40, S42]
          rationale: "Strong candidate requires independent corroboration beyond accelerator activity."
          counterevidence_or_failure_modes: ["support channels can be unavailable or correlated"]
          calibration_note: "Replace with calibrated evidence-combination weights."
    decision_logic:
      - condition: "large inference, HPC, synthetic data generation, and benchmarks can satisfy compute conditions"
      - condition: "medium and strong labels require non-serving shape plus support channels"
      - condition: "this rule generates training-like model-development candidates; collectives, checkpoints, or achieved-operation identity support are needed for stronger training evidence"
    output:
      label: training_like_model_development_candidate
      confidence_scale: [weak, medium, strong]
      fields:
        - candidate_window
        - activity_score
        - non_serving_score
        - participant_count
        - accelerator_hours
        - support_channels
        - counterevidence_summary
    confidence_label: likely
    evidence_status: source_informed
    source_refs: [S07, S08, S27, S28, S29, S30, S36, S37, S38, S39]

  - id: achieved_ops_training_candidate
    purpose: large_compute_training_candidate
    required_features:
      - generic_achieved_operation_rate
      - compute_running_intervals
    alternate_required_features:
      allocation_window:
        - allocated_accelerator_count_by_sku
      activity_proxy:
        - tensor_matrix_mxu_neuron_or_engine_active_fraction
        - accelerator_busy_or_utilization_fraction
    derived_signals:
      - achieved_operation_integral
      - sustained_accelerator_activity_window
      - capacity_upper_bound_flop
      - cap_clock_power_factor
      - non_serving_score
      - telemetry_coverage_fraction
    supportive_features:
      - scaleout_port_tx_rx_bytes_packets
      - local_interconnect_tx_rx_bytes
      - fabric_port_device_sample_counters
      - rdma_congestion_retry_drop_error_counters
      - storage_write_operation_bytes
      - object_storage_operation_counts
      - filesystem_throughput_metadata_ops
      - container_resource_usage_quantity
    counterevidence_features:
      - load_balancer_gateway_flow_activity
      - north_south_external_egress
      - vpc_or_nsg_flow_records
    time_alignment: >
      Achieved-operation samples must integrate over the same running or
      allocated interval and monitored scope. Compare to capability rules before
      assigning confidence.
    trigger:
      type: threshold_logic_with_identity_gate
      portability: moderate
      evaluation_window: clock_aligned_overlap_window
      minimum_required_channels:
        - achieved_operation_rate_or_declared_proxy_estimate
        - allocation_or_running_context
        - capacity_upper_bound
        - training_identity_support_for_training_label
      operation_unit_normalization:
        required: true
        accepted_units: [FLOP, operations]
        rejected_without_review: [tokens, samples, requests, accelerator_hours]
        rule: "Normalize achieved rates to FLOP-like operations over the same precision/mode and window before comparing to policy thresholds."
      conditions:
        all:
          - metric: achieved_operation_integral.operation_count
            op: ">="
            value_ref: review_threshold_operations
          - metric: achieved_operation_integral.coverage_fraction
            op: ">="
            value_ref: min_achieved_ops_coverage_fraction
          - metric: achieved_operation_integral.unit_normalized
            op: "=="
            value: true
          - metric: achieved_operation_integral.operation_count_to_capacity_upper_bound_ratio
            op: "<="
            value_ref: max_claim_to_capacity_ratio
          - metric: telemetry_coverage_fraction.primary_channel_min
            op: ">="
            value_ref: min_primary_coverage_fraction
        any:
          - metric: achieved_operation_integral.source_method
            op: "=="
            value: direct_achieved_counter
          - metric: achieved_operation_integral.source_method
            op: "=="
            value: calibrated_activity_proxy
        none:
          - metric: achieved_operation_integral.operation_unit_mismatch
            op: "=="
            value: true
          - metric: achieved_operation_integral.counter_reset_unresolved
            op: "=="
            value: true
      label_gates:
        large_compute_candidate:
          all:
            - metric: achieved_operation_integral.operation_count
              op: ">="
              value_ref: review_threshold_operations
            - metric: achieved_operation_integral.unit_normalized
              op: "=="
              value: true
        large_compute_training_candidate:
          all:
            - metric: achieved_operation_integral.operation_count
              op: ">="
              value_ref: review_threshold_operations
            - metric: achieved_operation_integral.training_identity_support_score
              op: ">="
              value_ref: min_training_identity_support_score
            - metric: non_serving_score.serving_counterevidence_score
              op: "<="
              value_ref: max_serving_counterevidence_for_training_label
        strong_training_label:
          all:
            - metric: achieved_operation_integral.source_method
              op: "=="
              value: direct_achieved_counter
            - metric: achieved_operation_integral.coverage_fraction
              op: ">="
              value_ref: strong_achieved_ops_coverage_fraction
            - metric: achieved_operation_integral.training_identity_support_score
              op: ">="
              value_ref: strong_training_identity_support_score
            - metric: non_serving_score.serving_counterevidence_score
              op: "<="
              value_ref: max_serving_counterevidence_for_strong_training_label
      suppression_conditions:
        - id: capacity_exceedance_or_unit_mismatch
          metric: achieved_operation_integral.operation_count_to_capacity_upper_bound_ratio
          op: ">"
          value_ref: max_claim_to_capacity_ratio
          suppresses_confidence_at_or_above: weak
        - id: achieved_ops_without_training_identity
          metric: achieved_operation_integral.training_identity_support_score
          op: "<"
          value_ref: min_training_identity_support_score
          suppresses_training_label_only: true
      confidence_mapping:
        weak: "Operation count crosses the policy review threshold with normalized units and capacity sanity check; training identity may be absent."
        medium: "Large compute plus medium training-identity support from collectives, checkpoints, non-serving shape, or runtime/container evidence."
        strong: "Direct achieved-operation counters with high coverage, capacity sanity pass, strong training-identity support, and weak serving counterevidence."
      calibration_defaults:
        - name: review_threshold_operations
          value: 1.0e25
          unit: operations
          evidence_status: source_backed
          source_refs: [S01, S03]
          rationale: "Policy review threshold for systemic-risk scale; it does not classify workload type."
          counterevidence_or_failure_modes: ["large inference, synthetic data generation, HPC, and benchmarks can also exceed this compute scale"]
          calibration_note: "Replace only if governing policy threshold changes."
        - name: min_achieved_ops_coverage_fraction
          value: 0.75
          unit: fraction
          evidence_status: source_informed
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Operation integrals need substantial counter coverage to be executable."
          counterevidence_or_failure_modes: ["sampled or delayed counters can under-cover real work"]
          calibration_note: "Set by counter source scrape interval, aggregation, and missingness."
        - name: strong_achieved_ops_coverage_fraction
          value: 0.95
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Strong large-compute claims need near-complete achieved-counter coverage."
          counterevidence_or_failure_modes: ["some provider telemetry cannot guarantee this coverage"]
          calibration_note: "Tune by source reliability and delivery delay."
        - name: min_primary_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          source_refs: [S07, S08, S28, S29, S30, S36, S37, S38, S39]
          rationale: "Primary activity and context channels must cover most of the same window."
          counterevidence_or_failure_modes: ["coverage differs by telemetry source"]
          calibration_note: "Replace with measured coverage by source."
        - name: max_claim_to_capacity_ratio
          value: 1.10
          unit: ratio
          evidence_status: calibration_default
          source_refs: [S04, S05, S06, S07, S08, S09, S24]
          rationale: "Allows limited measurement and unit uncertainty while flagging claims above conservative cap-adjusted capacity."
          counterevidence_or_failure_modes: ["operation-unit mismatch or hidden capacity can distort the ratio"]
          calibration_note: "Replace with source-specific uncertainty model."
        - name: min_training_identity_support_score
          value: 0.50
          unit: score_0_to_1
          evidence_status: project_assumption
          source_refs: [S11, S12, S13, S14, S45, S46, S47]
          rationale: "Large compute becomes a training candidate only with independent training-identity or training-like support."
          counterevidence_or_failure_modes: ["some real training may lack visible identity channels", "batch inference or HPC can have misleading support"]
          calibration_note: "Calibrate from confirmed training and non-training large-compute windows."
        - name: strong_training_identity_support_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: project_assumption
          source_refs: [S11, S12, S13, S14, S45, S46, S47]
          rationale: "Strong training label needs multiple aligned identity signals, not compute volume alone."
          counterevidence_or_failure_modes: ["identity channels may be missing or suppressed by telemetry limits"]
          calibration_note: "Replace with calibrated evidence-combination model."
        - name: max_serving_counterevidence_for_training_label
          value: 0.45
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Training candidate label should have limited serving-shape counterevidence."
          counterevidence_or_failure_modes: ["mixed serving/training windows and artifact exports can inflate score"]
          calibration_note: "Calibrate with known inference and training windows."
        - name: max_serving_counterevidence_for_strong_training_label
          value: 0.25
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Strong training label requires weak serving-like traffic shape."
          counterevidence_or_failure_modes: ["shared gateways can produce false serving counterevidence"]
          calibration_note: "Tune by network architecture."
    decision_logic:
      - condition: "achieved_operation_integral >= policy threshold yields a large_compute_candidate"
      - condition: "the training label requires independent training-identity support"
      - condition: "capacity sanity check must pass before any positive confidence label is emitted"
      - condition: "proxy estimates from activity counters cannot produce strong labels without calibration"
    output:
      label: large_compute_training_candidate
      alternate_label: large_compute_candidate
      confidence_scale: [weak, medium, strong]
      fields:
        - operation_count
        - operation_unit
        - candidate_window
        - coverage_fraction
        - source_method
        - training_identity_support
        - cap_adjusted_capacity_check
        - counterevidence_summary
    confidence_label: likely
    evidence_status: source_informed
    source_refs: [S01, S03, S07, S08, S36, S37, S38, S39]
