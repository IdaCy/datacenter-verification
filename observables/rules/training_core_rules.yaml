          evidence_status: source_informed
          source_refs: [S31, S32, S33, S45, S46, S47]
          rationale: "Checkpoint-like writes are a sparse model-state identity shape when paired with large achieved compute."
          counterevidence_or_failure_modes:
            - "backup, replication, ETL, and generated data can pass"
          calibration_note: "Calibrate with large-compute storage traces."
        - name: min_large_compute_checkpoint_burst_count
          value: 2
          unit: bursts
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "One large write is insufficient for checkpoint-like identity."
          counterevidence_or_failure_modes:
            - "short jobs may save only one final checkpoint"
          calibration_note: "Replace with checkpoint policy."
    missing_channels_to_report:
      - allocation_or_running
      - serving_counterevidence
      - storage_explanation
      - capacity_sanity_check
    false_positive_risk: medium_high

  - id: serving_suppression
    purpose: sparse_false_positive_filter
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction, load_balancer_gateway_flow_activity]
        - [generic_achieved_operation_rate, load_balancer_gateway_flow_activity]
        - [accelerator_busy_or_utilization_fraction, load_balancer_gateway_flow_activity]
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction, north_south_external_egress]
        - [generic_achieved_operation_rate, north_south_external_egress]
        - [accelerator_busy_or_utilization_fraction, north_south_external_egress]
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction, vpc_or_nsg_flow_records]
        - [generic_achieved_operation_rate, vpc_or_nsg_flow_records]
        - [accelerator_busy_or_utilization_fraction, vpc_or_nsg_flow_records]
    emitted_statement:
      label: serving_like_activity_explanation
      label_semantics: suppression_or_explanation
      statement: "High accelerator activity overlaps serving-like network shape; suppress sparse training candidates unless another identity channel remains strong."
    trigger:
      type: two_feature_suppression_logic
      evaluation_window: activity_serving_overlap_window
      conditions:
        all:
          - metric: sparse_activity_score
            op: ">="
            value_ref: min_activity_for_serving_suppression
          - metric: serving_counterevidence_score
            op: ">="
            value_ref: min_serving_suppression_score
          - metric: serving_activity_overlap_fraction
            op: ">="
            value_ref: min_serving_activity_overlap_fraction
      suppresses_rules:
        - activity_nonserving_candidate
        - activity_fabric_cadence_candidate
        - ops_fabric_training_candidate
        - ops_checkpoint_training_candidate
      calibration_defaults:
        - name: min_activity_for_serving_suppression
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Serving explanation matters during material activity."
          counterevidence_or_failure_modes:
            - "shared gateways can map unrelated serving traffic to the window"
          calibration_note: "Calibrate with serving and training windows."
        - name: min_serving_suppression_score
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Strong serving shape should weaken sparse training candidates."
          counterevidence_or_failure_modes:
            - "artifact export or data ingress can look serving-like"
          calibration_note: "Replace with local serving-shape classifier."
        - name: min_serving_activity_overlap_fraction
          value: 0.50
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S27, S28, S29, S30, S34]
          rationale: "Serving shape should overlap the activity window."
          counterevidence_or_failure_modes:
            - "coarse flow logs can overstate overlap"
          calibration_note: "Tune by flow aggregation interval."

  - id: storage_operation_suppression
    purpose: sparse_false_positive_filter
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [storage_write_operation_bytes, storage_operation_intervals]
        - [object_storage_operation_counts, storage_operation_intervals]
        - [filesystem_throughput_metadata_ops, storage_operation_intervals]
        - [scaleout_port_tx_rx_bytes_packets, storage_operation_intervals]
        - [storage_write_operation_bytes, object_or_file_copy_movement_records]
        - [object_storage_operation_counts, object_or_file_copy_movement_records]
    emitted_statement:
      label: storage_operation_explanation
      label_semantics: suppression_or_explanation
      statement: "A storage operation interval explains storage or fabric activity that could otherwise look checkpoint-like or distributed."
    trigger:
      type: two_feature_explanation_logic
      evaluation_window: storage_activity_operation_overlap_window
      conditions:
        all:
          - metric: storage_or_fabric_activity_score
            op: ">="
            value_ref: min_storage_or_fabric_activity_score
          - metric: storage_operation_type
            op: in
            value_ref: explanatory_storage_operation_types
          - metric: operation_activity_overlap_fraction
            op: ">="
            value_ref: min_operation_activity_overlap_fraction
          - metric: bytes_explained_fraction
            op: ">="
            value_ref: min_bytes_explained_fraction
      suppresses_rules:
        - activity_checkpoint_candidate
        - allocated_activity_checkpoint_training_candidate
        - ops_checkpoint_training_candidate
        - activity_fabric_cadence_candidate
      calibration_defaults:
        - name: min_storage_or_fabric_activity_score
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S31, S32, S33, S42, S43]
          rationale: "Only material storage/fabric activity needs explanation."
          counterevidence_or_failure_modes:
            - "small checkpoints can matter even below this score"
          calibration_note: "Calibrate with storage and fabric baselines."
        - name: explanatory_storage_operation_types
          value: [backup, restore, rebuild, replication, migration, disaster_recovery, snapshot, object_copy, etl_export]
          unit: categorical_set
          evidence_status: source_informed
          source_refs: [S31, S32, S33, S34, S35]
          rationale: "Explicit operation labels can directly explain storage movement."
          counterevidence_or_failure_modes:
            - "training can overlap broad storage-operation windows"
          calibration_note: "Normalize local storage operation labels."
        - name: min_operation_activity_overlap_fraction
          value: 0.80
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S31, S32, S33, S34, S35]
          rationale: "Operation interval should cover most suspicious activity before suppressing."
          counterevidence_or_failure_modes:
            - "coarse operation intervals can over-explain"
          calibration_note: "Tune by operation timestamp accuracy."
        - name: min_bytes_explained_fraction
          value: 0.70
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S31, S32, S33]
          rationale: "Most bytes should be attributable to the storage operation."
          counterevidence_or_failure_modes:
            - "shared links can mix storage and training traffic"
          calibration_note: "Calibrate byte attribution by route and storage system."

  - id: benchmark_like_suppression
    purpose: sparse_false_positive_filter
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction, scaleout_port_tx_rx_bytes_packets]
        - [generic_achieved_operation_rate, scaleout_port_tx_rx_bytes_packets]
        - [accelerator_busy_or_utilization_fraction, scaleout_port_tx_rx_bytes_packets]
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction, local_interconnect_tx_rx_bytes]
        - [generic_achieved_operation_rate, local_interconnect_tx_rx_bytes]
        - [accelerator_busy_or_utilization_fraction, local_interconnect_tx_rx_bytes]
    emitted_statement:
      label: benchmark_like_collective_explanation
      label_semantics: suppression_or_explanation
      statement: "Very regular, short-duration collective-like activity weakens sparse distributed-training candidates."
    trigger:
      type: two_feature_suppression_logic
      evaluation_window: activity_fabric_overlap_window
      conditions:
        all:
          - metric: sparse_fabric_cadence_score
            op: ">="
            value_ref: min_benchmark_like_cadence_score
          - metric: benchmark_regularity_score
            op: ">="
            value_ref: min_benchmark_regularity_score
          - metric: paired_window_duration_seconds
            op: "<="
            value_ref: max_benchmark_like_duration_seconds
          - metric: sparse_checkpoint_write_score
            op: "<="
            value_ref: max_checkpoint_score_for_benchmark_suppression
            missing_behavior: pass_with_missing_qualifier
      suppresses_rules:
        - activity_fabric_cadence_candidate
        - allocated_activity_fabric_training_candidate
        - running_activity_fabric_training_candidate
        - ops_fabric_training_candidate
      calibration_defaults:
        - name: min_benchmark_like_cadence_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: mechanism_inferred
          source_refs: [S11, S15, S16, S17, S25]
          rationale: "Communication benchmarks can produce clean collective-like cadence."
          counterevidence_or_failure_modes:
            - "some training traces are also highly regular"
          calibration_note: "Calibrate with local NCCL/MPI benchmark runs."
        - name: min_benchmark_regularity_score
          value: 0.90
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S11, S25]
          rationale: "Synthetic tests are often more regular than full training."
          counterevidence_or_failure_modes:
            - "steady-state training can be regular"
          calibration_note: "Tune with benchmark and training traces."
        - name: max_benchmark_like_duration_seconds
          value: 7200
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S11, S25]
          rationale: "Short, highly regular collective windows are more benchmark-like."
          counterevidence_or_failure_modes:
            - "long benchmarks and short fine-tunes exist"
          calibration_note: "Replace with local benchmark duration distribution."
        - name: max_checkpoint_score_for_benchmark_suppression
          value: 0.25
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S45, S46, S47]
          rationale: "Benchmark explanation is stronger when checkpoint-like support is absent or weak."
          counterevidence_or_failure_modes:
            - "training without visible checkpoints can be real"
          calibration_note: "Tune by checkpoint visibility."

  - id: capacity_threshold_possible
    purpose: sparse_capacity_context
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [accelerator_count_by_family_sku, advertised_peak_rate_by_precision]
    emitted_statement:
      label: threshold_scale_capacity_possible
      label_semantics: screen_only
      max_confidence: screen
      statement: "Installed or provisioned capacity could exceed the policy threshold in the window; this is possibility, not activity or training."
    trigger:
      type: two_feature_capacity_screen_logic
      evaluation_window: capacity_validity_window
      conditions:
        all:
          - metric: sparse_capacity_upper_bound_operations
            op: ">="
            value_ref: policy_threshold_operations
          - metric: capacity_input_coverage_fraction
            op: ">="
            value_ref: min_sparse_capacity_coverage_fraction
      calibration_defaults:
        - name: policy_threshold_operations
          value: 1.0e25
          unit: operations
          evidence_status: source_backed
          source_refs: [S01, S03]
          rationale: "Policy review scale for large compute."
          counterevidence_or_failure_modes:
            - "capacity is not activity"
          calibration_note: "Replace only if policy changes."
        - name: min_sparse_capacity_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S04, S05, S06, S24]
          rationale: "Sparse capacity screen still needs coverage of count and peak-rate validity."
          counterevidence_or_failure_modes:
            - "missing caps, health, installation, or topology can overstate usable capacity"
          calibration_note: "Full capacity rules should supersede this screen when available."
    cannot_conclude:
      - activity
      - training
      - achieved_compute

  - id: capacity_threshold_ruled_out
    purpose: sparse_capacity_context
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [accelerator_count_by_family_sku, advertised_peak_rate_by_precision]
    emitted_statement:
      label: threshold_scale_capacity_not_supported_sparse
      label_semantics: screen_only
      max_confidence: weak
      statement: "Sparse installed/provisioned capacity upper bound is below the policy threshold; this is weak no-capacity support unless full availability and service channels are covered."
    trigger:
      type: two_feature_capacity_screen_logic
      evaluation_window: capacity_validity_window
      conditions:
        all:
          - metric: sparse_capacity_upper_bound_operations
            op: "<"
            value_ref: policy_threshold_operations
          - metric: capacity_input_coverage_fraction
            op: ">="
            value_ref: min_sparse_capacity_coverage_fraction_for_ruleout
      confidence_cap_rules:
        - condition: "No availability, health, partition, service, or cloud-running feature is present"
          cap: weak
          output_qualifier: sparse_upper_bound_only
      calibration_defaults:
        - name: policy_threshold_operations
          value: 1.0e25
          unit: operations
          evidence_status: source_backed
          source_refs: [S01, S03]
          rationale: "Policy review scale for large compute."
          counterevidence_or_failure_modes:
            - "hidden or unmonitored capacity can invalidate a sparse rule-out"
          calibration_note: "Replace only if policy changes."
        - name: min_sparse_capacity_coverage_fraction_for_ruleout
          value: 0.95
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S04, S05, S06, S24]
          rationale: "Sparse capacity rule-out requires near-complete count and peak-rate coverage."
          counterevidence_or_failure_modes:
            - "missing instance/inventory scope can understate capacity"
          calibration_note: "Use derived capacity bounds and aggregation gates for strong rule-out claims."
    cannot_conclude:
      - no_training
      - no_large_compute_when_activity_channels_are_missing

sparse_promotion_policy:
  promote_to_aggregation_when_available:
    - "If allocation/running, accelerator activity, fabric cadence, and serving counterevidence are all present, evaluate distributed-training-like aggregation."
    - "If allocation/running, accelerator activity, checkpoint-like writes, and storage-operation counterevidence are present, evaluate checkpoint-training-like aggregation."
    - "If achieved operations cross the policy threshold and any identity-shape channel is present, evaluate sparse-large-compute aggregation."
  do_not_promote_when:
    - "The only positive signal is capacity."
    - "The only positive signal is accelerator activity."
    - "Serving, storage-operation, benchmark, or HPC suppressors explain the sparse signal."
    - "Primary source coverage is unknown and the candidate depends on absence of counterevidence."

output_fields:
  required_for_every_rule:
    - rule_id
    - raw_feature_budget
    - observed_feature_ids
    - candidate_window
    - emitted_label
    - max_confidence
    - missing_channels_to_report
    - false_positive_risk
    - calibration_defaults_used
  required_when_training_like:
    - identity_shape_channel
    - activity_score
    - time_overlap_or_adjacency_fraction
    - suppressors_checked
    - suppressors_missing
