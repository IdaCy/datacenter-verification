schema_version: "0.1"
created: "2026-05-16"
source_inventory: observables/observables.yaml
status: concrete_sparse_algorithm_rule_spec

purpose: >
  Sparse raw-feature pathways for sparse telemetry settings. This layer
  intentionally asks: with one, two, or three trusted observable features from
  `observables/observables.yaml`, what is the strongest honest statement the
  verifier can make about possible training or training-like model development?

scope_policy:
  trusted_local_inputs: "Only raw feature IDs from observables/observables.yaml are used as inputs."
  relationship_to_aggregation_rules: >
    This file supplies sparse candidate and weak-evidence pathways for the
    public aggregation layer. Stronger warning heights come from staged joins,
    suppressor checks, and final routing in `aggregation_rules.yaml`.
  no_hidden_feature_policy: >
    A sparse rule's `raw_feature_budget` counts only raw observables directly
    required by the rule. Optional strengthening or suppression channels are
    listed separately and must not be silently required for the base output.

sparse_label_semantics:
  screen_only:
    meaning: "A single channel is interesting but not workload identity."
    max_confidence: screen
    review_action: "Keep the window for joining with other sparse rules and aggregation."
  candidate:
    meaning: "Sparse evidence is consistent with training but materially underdetermined."
    max_confidence: weak
    review_action: "Route to review or attempt joins with support/counterevidence."
  weak_training_evidence:
    meaning: "A sparse pair or triple includes at least one training-identity shape signal plus accelerator activity."
    max_confidence: weak
    review_action: "Can seed a training-evidence candidate, but cannot become medium without an independent additional channel."
  probable_training_candidate:
    meaning: "Three raw features align activity, context, and a training-like identity shape."
    max_confidence: medium
    review_action: "Promote to full core rules when possible; require suppressor checks before strong claims."
  large_compute_candidate:
    meaning: "Operation integral reaches policy scale; this is compute scale, not workload identity."
    max_confidence: medium
    review_action: "Require identity support before calling it training."
  suppression_or_explanation:
    meaning: "Sparse counterevidence weakens or explains a sparse candidate."
    max_confidence: not_applicable
    review_action: "Apply before promoting any sparse candidate."

sparse_feature_constraints:
  - "No rule in this file requires more than three raw feature IDs for its base trigger."
  - "A one-feature rule may only emit `screen_only` or `large_compute_candidate`, never training identity."
  - "A two-feature rule may emit `weak_training_evidence` only if one feature is accelerator activity and the other is a training-like identity-shape channel."
  - "A three-feature rule may emit `probable_training_candidate` when it combines context, accelerator activity, and identity-shape evidence."
  - "Strong training evidence is out of scope for this file unless future raw observables include direct source-emitted training runtime semantics."
  - "Missing counterevidence is represented as missing; it is not treated as absence."

sparse_feature_classes:
  context:
    allocation_or_running:
      - allocated_accelerator_count_by_sku
      - compute_running_intervals
  accelerator_activity:
    direct_or_proxy:
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - generic_achieved_operation_rate
      - accelerator_busy_or_utilization_fraction
  fabric_identity_shape:
    collective_like_possible:
      - scaleout_port_tx_rx_bytes_packets
      - local_interconnect_tx_rx_bytes
      - fabric_port_device_sample_counters
  checkpoint_identity_shape:
    checkpoint_like_possible:
      - storage_write_operation_bytes
      - object_storage_operation_counts
      - filesystem_throughput_metadata_ops
  serving_counterevidence:
    serving_shape_possible:
      - load_balancer_gateway_flow_activity
      - north_south_external_egress
      - vpc_or_nsg_flow_records
  storage_explanation:
    explicit_storage_operations:
      - storage_operation_intervals
      - object_or_file_copy_movement_records
  capacity_context:
    upper_bound_possible:
      - accelerator_count_by_family_sku
      - advertised_peak_rate_by_precision

rule_categories:
  - id: large_compute_scale
    name: Large compute / scale
    algorithm_treatment: >
      Use for policy-scale compute review and prioritization. Do not interpret
      as training identity unless joined with an identity-shape category and
      suppressors are checked.
    evidentiary_statement: "Large achieved compute happened or may have happened."
    confidence_policy:
      max_standalone_confidence: medium
      can_emit_training_label_by_itself: false
      promotion_requirement: "Join with fabric_parameter_update_like, storage_checkpoint_state_like, or another independent identity channel."
    rule_ids:
      - large_compute_screen
      - ops_fabric_training_candidate
      - ops_checkpoint_training_candidate

  - id: capacity_physical_possibility
    name: Capacity / physical possibility
    algorithm_treatment: >
      Use for feasibility screens, rule-out support, and capacity triage. These
      rules do not show that activity occurred.
    evidentiary_statement: "The monitored capacity could or could not support threshold-scale compute under sparse assumptions."
    confidence_policy:
      max_standalone_confidence: weak
      can_emit_training_label_by_itself: false
      promotion_requirement: "Join with activity or achieved-operation evidence before any run-level claim."
    rule_ids:
      - capacity_threshold_possible
      - capacity_threshold_ruled_out

  - id: accelerator_activity_run_existence
    name: Accelerator activity / run existence
    algorithm_treatment: >
      Use to create candidate windows and attach allocation/running context.
      Treat as workload-agnostic activity evidence.
    evidentiary_statement: "Accelerator work occurred, optionally tied to allocation or running context."
    confidence_policy:
      max_standalone_confidence: weak
      can_emit_training_label_by_itself: false
      promotion_requirement: "Join with at least one identity-shape category for training-like evidence."
    rule_ids:
      - activity_only_screen
      - allocated_activity_candidate
      - running_activity_candidate

  - id: fabric_parameter_update_like
    name: Fabric / parameter-update-like behavior
    algorithm_treatment: >
      Use as sparse distributed-training identity evidence. Prioritize joins
      with activity/run context and suppressors for serving, benchmark, HPC, and
      storage explanations.
    evidentiary_statement: "Collective-like fabric behavior may correspond to gradient synchronization, parameter-shard movement, or tensor/pipeline communication."
    confidence_policy:
      max_standalone_confidence: medium
      can_emit_training_label_by_itself: weak_only
      promotion_requirement: "Join with context/activity and suppressors before stronger warning heights."
    rule_ids:
      - activity_fabric_cadence_candidate
      - allocated_activity_fabric_training_candidate
      - running_activity_fabric_training_candidate
      - ops_fabric_training_candidate

  - id: storage_checkpoint_state_like
    name: Storage / checkpoint-state-like behavior
    algorithm_treatment: >
      Use as sparse model-state or optimizer-state storage evidence. Always
      check storage-operation explanations before promotion.
    evidentiary_statement: "Repeated checkpoint-like writes may correspond to model, optimizer, shard, or training-state persistence."
    confidence_policy:
      max_standalone_confidence: medium
      can_emit_training_label_by_itself: weak_only
      promotion_requirement: "Join with activity/context and storage-operation suppressors before stronger warning heights."
    rule_ids:
      - activity_checkpoint_candidate
      - allocated_activity_checkpoint_training_candidate
      - ops_checkpoint_training_candidate

  - id: non_serving_workload_shape
    name: Non-serving / workload shape
    algorithm_treatment: >
      Use to distinguish online serving from offline accelerator work when
      network coverage is known. This category supports routing, not training
      identity by itself.
    evidentiary_statement: "Active accelerator compute lacks serving-like network shape in covered telemetry."
    confidence_policy:
      max_standalone_confidence: weak
      can_emit_training_label_by_itself: false
      promotion_requirement: "Join with fabric or checkpoint identity-shape evidence."
    rule_ids:
      - activity_nonserving_candidate

  - id: suppressors_alternative_explanations
    name: Suppressors / alternative explanations
    algorithm_treatment: >
      Apply before promotion. These rules weaken, suppress, or explain sparse
      positive candidates and should be retained in the output as explicit
      counterevidence.
    evidentiary_statement: "Serving, storage operations, or benchmark-like patterns explain or weaken a sparse training candidate."
    confidence_policy:
      max_standalone_confidence: not_applicable
      can_emit_training_label_by_itself: false
      promotion_requirement: "Not promotable; these are counterevidence and explanation rules."
    rule_ids:
      - serving_suppression
      - storage_operation_suppression
      - benchmark_like_suppression

rule_category_membership:
  membership_policy: >
    Categories are evidentiary roles, not a strict partition. A rule may appear
    in multiple categories when it makes more than one algorithmically relevant
    statement. Use `primary_category` for default routing and
    `additional_categories` for secondary scoring, joins, or suppressor checks.
  rules:
    - rule_id: activity_only_screen
      primary_category: accelerator_activity_run_existence
      additional_categories: []
    - rule_id: large_compute_screen
      primary_category: large_compute_scale
      additional_categories: []
    - rule_id: allocated_activity_candidate
      primary_category: accelerator_activity_run_existence
      additional_categories: []
    - rule_id: running_activity_candidate
      primary_category: accelerator_activity_run_existence
      additional_categories: []
    - rule_id: activity_fabric_cadence_candidate
      primary_category: fabric_parameter_update_like
      additional_categories:
        - accelerator_activity_run_existence
    - rule_id: activity_checkpoint_candidate
      primary_category: storage_checkpoint_state_like
      additional_categories:
        - accelerator_activity_run_existence
    - rule_id: activity_nonserving_candidate
      primary_category: non_serving_workload_shape
      additional_categories:
        - accelerator_activity_run_existence
    - rule_id: allocated_activity_fabric_training_candidate
      primary_category: fabric_parameter_update_like
      additional_categories:
        - accelerator_activity_run_existence
    - rule_id: running_activity_fabric_training_candidate
      primary_category: fabric_parameter_update_like
      additional_categories:
        - accelerator_activity_run_existence
    - rule_id: allocated_activity_checkpoint_training_candidate
      primary_category: storage_checkpoint_state_like
      additional_categories:
        - accelerator_activity_run_existence
    - rule_id: ops_fabric_training_candidate
      primary_category: large_compute_scale
      additional_categories:
        - fabric_parameter_update_like
    - rule_id: ops_checkpoint_training_candidate
      primary_category: large_compute_scale
      additional_categories:
        - storage_checkpoint_state_like
    - rule_id: serving_suppression
      primary_category: suppressors_alternative_explanations
      additional_categories:
        - non_serving_workload_shape
    - rule_id: storage_operation_suppression
      primary_category: suppressors_alternative_explanations
      additional_categories:
        - storage_checkpoint_state_like
        - fabric_parameter_update_like
    - rule_id: benchmark_like_suppression
      primary_category: suppressors_alternative_explanations
      additional_categories:
        - fabric_parameter_update_like
    - rule_id: capacity_threshold_possible
      primary_category: capacity_physical_possibility
      additional_categories: []
    - rule_id: capacity_threshold_ruled_out
      primary_category: capacity_physical_possibility
      additional_categories: []

sparse_score_definitions:
  - id: sparse_activity_score
    raw_feature_options:
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - generic_achieved_operation_rate
      - accelerator_busy_or_utilization_fraction
    output_unit: score_0_to_1
    formula: >
      For a single available activity channel, normalize covered samples over
      the candidate window. Use tensor/engine active fraction directly when
      available. Use achieved operation rate divided by cap-adjusted peak only
      when peak/cap context is explicitly available; otherwise score sustained
      nonzero achieved-rate percentile against local baseline. Use generic busy
      fraction as a weaker activity proxy.
    missing_data_behavior: "One activity channel is enough to produce a screen, but not enough to classify training."
    source_refs: [S07, S08, S36, S37, S38, S39]

  - id: sparse_fabric_cadence_score
    raw_feature_options:
      - scaleout_port_tx_rx_bytes_packets
      - local_interconnect_tx_rx_bytes
      - fabric_port_device_sample_counters
    output_unit: score_0_to_1
    formula: >
      From one fabric time series, detect repeated bursts above a local idle
      baseline. Score recurrence regularity, per-port or per-device synchrony
      when identities are present, and byte consistency. If only aggregate bytes
      exist, cap score at 0.55 because participant structure is not visible.
    missing_data_behavior: "Fabric cadence without accelerator activity is a distributed-workload screen, not training evidence."
    source_refs: [S11, S15, S16, S17, S25, S42, S43]

  - id: sparse_checkpoint_write_score
    raw_feature_options:
      - storage_write_operation_bytes
      - object_storage_operation_counts
      - filesystem_throughput_metadata_ops
    output_unit: score_0_to_1
    formula: >
      Detect repeated write bursts or object PUT/COPY sequences. Score burst
      count, interval regularity, size consistency, and metadata coherence if
      object/filesystem fields exist. A single burst is capped at 0.25.
    missing_data_behavior: "Checkpoint-like writes without accelerator activity are storage candidates or discrepancies, not training evidence."
    source_refs: [S31, S32, S33, S45, S46, S47]

  - id: sparse_non_serving_score
    raw_feature_options:
      - load_balancer_gateway_flow_activity
      - north_south_external_egress
      - vpc_or_nsg_flow_records
    output_unit: score_0_to_1
    formula: >
      Score lack of serving-like gateway connection churn, request/response
      flow shape, and response-like external egress during the activity window.
      If the serving channel is missing, output `coverage_unknown` rather than
      high non-serving score.
    missing_data_behavior: "Missing serving telemetry cannot strengthen a candidate."
    source_refs: [S27, S28, S29, S30, S34]

training_core_rules:
  - id: activity_only_screen
    purpose: sparse_activity_screen
    raw_feature_budget: 1
    required_feature_sets:
      any_one_of:
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction]
        - [generic_achieved_operation_rate]
        - [accelerator_busy_or_utilization_fraction]
    emitted_statement:
      label: accelerator_activity_screen
      label_semantics: screen_only
      max_confidence: screen
      statement: "Accelerator activity occurred; workload identity is unresolved."
    trigger:
      type: one_feature_threshold_logic
      evaluation_window: single_activity_channel_window
      conditions:
        all:
          - metric: sparse_activity_score
            op: ">="
            value_ref: min_activity_screen_score
          - metric: activity_duration_seconds
            op: ">="
            value_ref: min_activity_screen_duration_seconds
          - metric: activity_channel_coverage_fraction
            op: ">="
            value_ref: min_single_channel_coverage_fraction
      calibration_defaults:
        - name: min_activity_screen_score
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "A single activity channel needs a moderate normalized score before it is worth joining with other evidence."
          counterevidence_or_failure_modes:
            - "inference, HPC, benchmarks, burn-in, and synthetic data generation can all pass"
            - "communication-bound or input-bound training can be below this value"
          calibration_note: "Replace with local activity-score distributions by accelerator family and workload."
        - name: min_activity_screen_duration_seconds
          value: 600
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Filters short telemetry spikes without excluding short candidate jobs."
          counterevidence_or_failure_modes:
            - "short unauthorized or fine-tuning jobs can be shorter"
          calibration_note: "Tune by source scrape interval and local job-duration distribution."
        - name: min_single_channel_coverage_fraction
          value: 0.70
          unit: fraction
          evidence_status: source_informed
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Sparse sparse rules should still require most of the single channel to be covered."
          counterevidence_or_failure_modes:
            - "sample gaps can hide or fabricate sustained activity windows"
          calibration_note: "Replace with telemetry source coverage."
    false_positive_risk: high
    cannot_conclude:
      - training
      - non_serving
      - large_model_development

  - id: large_compute_screen
    purpose: sparse_large_compute_candidate
    raw_feature_budget: 1
    required_feature_sets:
      any_one_of:
        - [generic_achieved_operation_rate]
    emitted_statement:
      label: large_compute_candidate
      label_semantics: large_compute_candidate
      max_confidence: medium
      statement: "A normalized achieved-operation integral crosses the policy review threshold; workload identity is unresolved."
    trigger:
      type: one_feature_integral_threshold_logic
      evaluation_window: achieved_operation_counter_window
      conditions:
        all:
          - metric: achieved_operation_count
            op: ">="
            value_ref: policy_threshold_operations
          - metric: operation_unit_normalized
            op: "=="
            value: true
          - metric: achieved_operation_coverage_fraction
            op: ">="
            value_ref: min_achieved_ops_coverage_fraction
      calibration_defaults:
        - name: policy_threshold_operations
          value: 1.0e25
          unit: operations
          evidence_status: source_backed
          source_refs: [S01, S03]
          rationale: "Policy review scale for large compute; not a workload identity threshold."
          counterevidence_or_failure_modes:
            - "large inference, HPC, synthetic data generation, and benchmarks can cross this scale"
          calibration_note: "Replace only if the governing policy threshold changes."
        - name: min_achieved_ops_coverage_fraction
          value: 0.75
          unit: fraction
          evidence_status: source_informed
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "A one-feature operation integral needs substantial counter coverage."
          counterevidence_or_failure_modes:
            - "counter reset, unit mismatch, or aggregation gaps can distort the integral"
          calibration_note: "Replace with achieved-counter coverage and reset-handling data."
    false_positive_risk: high_for_training_identity
    cannot_conclude:
      - training
      - model_development

  - id: allocated_activity_candidate
    purpose: sparse_ml_compute_candidate
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [allocated_accelerator_count_by_sku, tensor_matrix_mxu_neuron_or_engine_active_fraction]
        - [allocated_accelerator_count_by_sku, generic_achieved_operation_rate]
        - [allocated_accelerator_count_by_sku, accelerator_busy_or_utilization_fraction]
    emitted_statement:
      label: allocated_accelerator_compute_candidate
      label_semantics: candidate
      max_confidence: weak
      statement: "Allocated accelerators were active; training identity is unresolved."
    trigger:
      type: two_feature_context_activity_logic
      evaluation_window: allocation_activity_overlap_window
      conditions:
        all:
          - metric: allocation_activity_overlap_fraction
            op: ">="
            value_ref: min_context_activity_overlap_fraction
          - metric: sparse_activity_score
            op: ">="
            value_ref: min_context_activity_score
          - metric: allocation_or_activity_window_duration_seconds
            op: ">="
            value_ref: min_context_activity_duration_seconds
      calibration_defaults:
        - name: min_context_activity_overlap_fraction
          value: 0.60
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S18, S19, S20, S07, S08, S36, S37, S38, S39]
          rationale: "Activity should overlap the allocation for most of the sparse window."
          counterevidence_or_failure_modes:
            - "clock drift, accounting delay, or preemption can lower overlap"
          calibration_note: "Tune by scheduler accounting and activity scrape timing."
        - name: min_context_activity_score
          value: 0.55
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Requires material accelerator activity inside the allocation."
          counterevidence_or_failure_modes:
            - "serving, HPC, benchmarks, and burn-in can all pass"
          calibration_note: "Calibrate from known allocated workload classes."
        - name: min_context_activity_duration_seconds
          value: 1800
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S18, S19, S20]
          rationale: "Filters allocation setup/teardown and short bursts."
          counterevidence_or_failure_modes:
            - "short fine-tuning can be real training"
          calibration_note: "Replace with local job-duration distribution."
    missing_channels_to_report:
      - fabric_identity_shape
      - checkpoint_identity_shape
      - serving_counterevidence
    false_positive_risk: high

  - id: running_activity_candidate
    purpose: sparse_ml_compute_candidate
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [compute_running_intervals, tensor_matrix_mxu_neuron_or_engine_active_fraction]
        - [compute_running_intervals, generic_achieved_operation_rate]
        - [compute_running_intervals, accelerator_busy_or_utilization_fraction]
    emitted_statement:
      label: running_accelerator_compute_candidate
      label_semantics: candidate
      max_confidence: weak
      statement: "Accelerator-bearing compute was running and active; training identity is unresolved."
    trigger:
      type: two_feature_context_activity_logic
      evaluation_window: running_activity_overlap_window
      conditions:
        all:
          - metric: running_activity_overlap_fraction
            op: ">="
            value_ref: min_context_activity_overlap_fraction
          - metric: sparse_activity_score
            op: ">="
            value_ref: min_context_activity_score
          - metric: running_activity_duration_seconds
            op: ">="
            value_ref: min_context_activity_duration_seconds
      calibration_defaults:
        - name: min_context_activity_overlap_fraction
          value: 0.60
          unit: fraction
          evidence_status: calibration_default
          source_refs: [S23, S24, S26, S35, S07, S08, S36, S37, S38, S39]
          rationale: "Cloud running state should overlap active accelerator telemetry."
          counterevidence_or_failure_modes:
            - "provider billing/running intervals can be aggregated or delayed"
          calibration_note: "Tune by provider control-plane and billing delay."
        - name: min_context_activity_score
          value: 0.55
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Requires material accelerator activity inside the running interval."
          counterevidence_or_failure_modes:
            - "serving, HPC, benchmarks, and burn-in can all pass"
          calibration_note: "Calibrate from known cloud workload classes."
        - name: min_context_activity_duration_seconds
          value: 1800
          unit: seconds
          evidence_status: calibration_default
          source_refs: [S23, S24, S26, S35]
          rationale: "Filters brief startup and teardown activity."
          counterevidence_or_failure_modes:
            - "short fine-tunes can be real training"
          calibration_note: "Replace with cloud workload duration distribution."
    missing_channels_to_report:
      - fabric_identity_shape
      - checkpoint_identity_shape
      - serving_counterevidence
    false_positive_risk: high

  - id: activity_fabric_cadence_candidate
    purpose: sparse_distributed_training_like_candidate
    raw_feature_budget: 2
    required_feature_sets:
      any_one_of:
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction, scaleout_port_tx_rx_bytes_packets]
        - [generic_achieved_operation_rate, scaleout_port_tx_rx_bytes_packets]
        - [accelerator_busy_or_utilization_fraction, scaleout_port_tx_rx_bytes_packets]
        - [tensor_matrix_mxu_neuron_or_engine_active_fraction, local_interconnect_tx_rx_bytes]
        - [generic_achieved_operation_rate, local_interconnect_tx_rx_bytes]
        - [accelerator_busy_or_utilization_fraction, local_interconnect_tx_rx_bytes]
    emitted_statement:
      label: collective_like_training_candidate
      label_semantics: weak_training_evidence
      max_confidence: weak
      statement: "Accelerator activity and collective-like fabric cadence co-occur; training-like distributed work is plausible but attribution and false positives are unresolved."
    trigger:
      type: two_feature_activity_identity_logic
      evaluation_window: activity_fabric_overlap_window
      conditions:
        all:
          - metric: sparse_activity_score
            op: ">="
            value_ref: min_activity_for_fabric_pair
          - metric: sparse_fabric_cadence_score
            op: ">="
            value_ref: min_fabric_cadence_pair_score
          - metric: activity_fabric_overlap_fraction
            op: ">="
            value_ref: min_activity_fabric_overlap_fraction
          - metric: paired_window_duration_seconds
            op: ">="
            value_ref: min_activity_fabric_duration_seconds
      confidence_cap_rules:
        - condition: "No allocation/running feature is present"
          cap: weak
          output_qualifier: unattributed
        - condition: "No serving/storage/benchmark suppressor channel is present"
          cap: weak
          output_qualifier: suppressors_unchecked
      calibration_defaults:
        - name: min_activity_for_fabric_pair
          value: 0.55
          unit: score_0_to_1
          evidence_status: calibration_default
          source_refs: [S07, S08, S36, S37, S38, S39]
          rationale: "Fabric cadence should be paired with material accelerator activity."
          counterevidence_or_failure_modes:
            - "inference and HPC can also align fabric with accelerator activity"
          calibration_note: "Calibrate by local activity traces."
        - name: min_fabric_cadence_pair_score
          value: 0.60
          unit: score_0_to_1
          evidence_status: mechanism_inferred
          source_refs: [S11, S12, S13, S14, S15, S16, S17]
          rationale: "Distributed training mechanisms create repeated collective-like traffic, but exact score is not portable."
          counterevidence_or_failure_modes:
            - "NCCL tests, MPI/HPC, and distributed inference can pass"
            - "aggregate-only fabric bytes can overstate cadence"
          calibration_note: "Replace with site fabric cadence scores from known workloads."
        - name: min_activity_fabric_overlap_fraction
