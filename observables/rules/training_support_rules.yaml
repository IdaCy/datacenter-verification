schema_version: "0.1"
created: "2026-05-16"
source_inventory: observables/observables.yaml
status: study_algorithm_rule_spec

support_policy:
  primary_evidence_policy: >
    Rules in this file may strengthen, weaken, explain, or route review of a
    core training finding. They should not by themselves produce a strong
    training evidence label.
  output_labels:
    - strengthens_core_training_evidence
    - weakens_core_training_evidence
    - explains_candidate_activity
    - requires_review

training_support_rules:
  - id: memory_residency_support
    purpose: supportive_training_context
    required_features:
      - hbm_or_device_memory_used
    optional_features:
      - memory_capacity_bytes
      - allocated_accelerator_count_by_sku
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - storage_write_operation_bytes
      - object_storage_operation_counts
    derived_signals:
      - checkpoint_size_consistency
    time_alignment: "High memory residency must overlap allocation/activity windows to support a large-model hypothesis."
    logic: >
      Compare per-device memory used and high-water values with device capacity
      and participant count. Treat high, changing residency with checkpoint or
      tensor activity as supportive; treat static residency without activity as
      possible serving or idle reservation.
    trigger:
      type: support_score_threshold_logic
      evaluation_window: clock_aligned_overlap_window
      portability: weak
      source_refs: [S04, S05, S06, S07, S08, S09, S36, S37, S38, S39, S45, S46, S47]
      conditions:
        all:
          - metric: memory_residency_fraction
            op: ">="
            value_ref: min_memory_residency_fraction
          - metric: sustained_accelerator_activity_window.activity_score
            op: ">="
            value_ref: min_activity_score_for_memory_support
          - metric: activity_overlap_fraction
            op: ">="
            value_ref: min_activity_overlap_fraction
        any:
          - metric: checkpoint_size_consistency.size_consistency_score
            op: ">="
            value_ref: min_checkpoint_size_consistency_score
          - metric: residency_change_score
            op: ">="
            value_ref: min_dynamic_residency_score
      scoring:
        memory_residency_support_score: "clamp(0.45 * memory_residency_fraction + 0.30 * activity_overlap_fraction + 0.25 * max(checkpoint_size_consistency.size_consistency_score, residency_change_score), 0, 1)"
      score_effect:
        training_core_confidence_delta: 1
        applies_when_score_gte: 0.70
        explanation_priority: medium
      calibration_defaults:
        - name: min_memory_residency_fraction
          value: 0.60
          unit: fraction_of_device_memory
          evidence_status: calibration_default
          rationale: "Large model context should occupy a material fraction of device memory, but exact residency varies by model, sharding, cache, and serving."
          counterevidence_or_failure_modes: ["large inference and cache-heavy jobs can exceed this", "adapter training can be below this"]
          calibration_note: "Replace with local memory-residency distributions for training, inference, serving, and idle reservations."
        - name: min_activity_score_for_memory_support
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Memory residency supports training only when joined with accelerator activity."
          counterevidence_or_failure_modes: ["model serving can have high residency and activity"]
          calibration_note: "Calibrate with hardware-specific activity and memory telemetry."
        - name: min_activity_overlap_fraction
          value: 0.50
          unit: fraction
          evidence_status: calibration_default
          rationale: "Requires memory state to overlap at least half of the candidate activity window."
          counterevidence_or_failure_modes: ["preloaded models can be resident before/after activity", "sampling gaps can lower overlap"]
          calibration_note: "Tune using memory scrape interval and model preload behavior."
        - name: min_checkpoint_size_consistency_score
          value: 0.55
          unit: score_0_to_1
          evidence_status: source_informed
          rationale: "Checkpoint-size consistency strengthens large trainable-state interpretation when present."
          counterevidence_or_failure_modes: ["backup snapshots can also be size-consistent"]
          calibration_note: "Replace with local checkpoint and backup size distributions."
        - name: min_dynamic_residency_score
          value: 0.40
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Changing residency during activity is more supportive than static allocation."
          counterevidence_or_failure_modes: ["serving can page/cache dynamically", "static full-model training can change little"]
          calibration_note: "Calibrate per framework and memory manager."
    output_fields:
      - memory_residency_fraction
      - residency_stability
      - supports_large_model_context
      - caveats
    confidence_label: likely
    source_refs: [S04, S05, S06, S07, S08, S09, S36, S37, S38, S39]

  - id: memory_bandwidth_activity_support
    purpose: supportive_activity_context
    required_features:
      - memory_bandwidth_or_dram_active
    optional_features:
      - memory_bandwidth_bytes_per_sec
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - accelerator_busy_or_utilization_fraction
      - storage_read_operation_bytes
      - storage_write_operation_bytes
      - cache_hit_miss_counters
    derived_signals:
      - sustained_accelerator_activity_window
    time_alignment: "Memory activity must overlap accelerator activity or storage phases before it affects training support."
    logic: >
      Normalize observed memory activity by SKU capability. Step-correlated
      memory activity strengthens a compute interpretation; isolated memory
      pressure with low tensor activity is routed to data movement, inference,
      ETL, or cache explanations.
    output_fields:
      - normalized_memory_activity
      - activity_overlap_fraction
      - support_label
      - alternative_explanations
    confidence_label: likely
    source_refs: [S07, S08, S36, S37, S38, S39]

  - id: storage_staging_support
    purpose: supportive_data_lifecycle_context
    required_features:
      - storage_read_operation_bytes
    optional_features:
      - object_storage_operation_counts
      - object_or_file_copy_movement_records
      - storage_operation_intervals
      - cache_hit_miss_counters
      - north_south_external_egress
      - data_center_interconnect_wan_usage
      - compute_running_intervals
      - allocated_accelerator_count_by_sku
    derived_signals:
      - storage_staging_window
      - non_serving_score
    time_alignment: "Classify read/copy-in windows by their relation to candidate compute start, sustained activity, and final export."
    logic: >
      Large read or copy-in before a candidate activity window supports dataset
      staging; repeated reads during activity can support data loading. Weaken
      support when storage-operation records indicate restore, backup, ETL, or
      replication rather than training input.
    trigger:
      type: support_score_threshold_logic
      evaluation_window: compute_window_with_storage_lookaround
      portability: weak
      source_refs: [S31, S32, S33, S34, S35]
      lookback_seconds: 86400
      lookahead_seconds: 21600
      conditions:
        all:
          - metric: storage_staging_window.normalized_staging_score
            op: ">="
            value_ref: min_normalized_staging_score
          - metric: storage_staging_window.relation_to_compute_window
            op: in
            value_ref: supportive_relations
          - metric: storage_staging_window.coverage_fraction
            op: ">="
            value_ref: min_storage_coverage_fraction
        none:
          - metric: storage_staging_window.operation_type
            op: in
            value_ref: suppressing_storage_operation_types
          - metric: storage_staging_window.bytes_explained_fraction
            op: ">="
            value_ref: max_explained_bytes_fraction_for_support
      scoring:
        storage_staging_support_score: "clamp(0.50 * normalized_staging_score + 0.30 * temporal_relation_score + 0.20 * non_serving_score.non_serving_score, 0, 1)"
      score_effect:
        training_core_confidence_delta: 1
        applies_when_score_gte: 0.65
        explanation_priority: medium
      calibration_defaults:
        - name: min_normalized_staging_score
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Uses normalized staging volume instead of a raw byte threshold."
          counterevidence_or_failure_modes: ["ETL, backup restore, and replication can move similar or larger volumes"]
          calibration_note: "Replace with dataset-size and storage baseline distributions."
        - name: supportive_relations
          value: [before, during]
          unit: categorical_set
          evidence_status: mechanism_inferred
          rationale: "Dataset staging usually precedes or overlaps compute; final export is weaker support."
          counterevidence_or_failure_modes: ["checkpoints and generated data can occur after compute", "prefetching can start long before compute"]
          calibration_note: "Tune lookback/lookahead windows from local data pipeline behavior."
        - name: min_storage_coverage_fraction
          value: 0.75
          unit: fraction
          evidence_status: source_informed
          rationale: "Storage logs are useful only when most relevant intervals are covered."
          counterevidence_or_failure_modes: ["best-effort object logs can miss requests"]
          calibration_note: "Replace with per-storage-system logging coverage."
        - name: suppressing_storage_operation_types
          value: [backup, restore, rebuild, replication, migration, disaster_recovery, etl_export]
          unit: categorical_set
          evidence_status: source_informed
          rationale: "These operation labels are explicit non-training explanations for storage movement."
          counterevidence_or_failure_modes: ["training can overlap with backup or replication windows"]
          calibration_note: "Calibrate operation labels and bytes-explained accounting."
        - name: max_explained_bytes_fraction_for_support
          value: 0.50
          unit: fraction
          evidence_status: calibration_default
          rationale: "If most bytes are explained by non-training storage operations, staging support should not strengthen training."
          counterevidence_or_failure_modes: ["shared storage operations can partially overlap real staging"]
          calibration_note: "Tune by storage-operation labeling accuracy."
    output_fields:
      - staging_window
      - bytes_staged
      - relation_to_compute_window
      - support_label
      - false_positive_explanations
    confidence_label: likely
    source_refs: [S31, S32, S33, S34, S35]

  - id: internal_data_movement_support
    purpose: supportive_network_context
    required_features:
      - east_west_internal_flow_bytes
    optional_features:
      - vpc_or_nsg_flow_records
      - data_center_interconnect_wan_usage
      - object_or_file_copy_movement_records
      - storage_operation_intervals
      - storage_read_operation_bytes
      - storage_write_operation_bytes
      - scaleout_port_tx_rx_bytes_packets
    derived_signals:
      - storage_staging_window
      - non_serving_score
    time_alignment: "Internal flow windows must be separated into accelerator-fabric, storage, service, and DCI scopes when source fields allow."
    logic: >
      Internal traffic among accelerator nodes and storage systems strengthens a
      distributed-workload or data-pipeline interpretation only when it aligns
      with accelerator activity. Prefer fabric telemetry for collective claims;
      treat general flow logs as supportive or explanatory.
    output_fields:
      - internal_bytes
      - flow_scope
      - relation_to_candidate_window
      - support_label
      - likely_non_training_explanation
    confidence_label: likely
    source_refs: [S28, S29, S30, S31, S33]

  - id: power_thermal_physical_support
    purpose: physical_consistency_support
    required_features:
      - accelerator_device_power_energy
    optional_features:
      - server_system_input_power
      - rack_pdu_it_power
      - facility_or_room_it_power_rollup
      - accelerator_temperature_celsius
      - inlet_outlet_air_or_coolant_temperature
      - coolant_flow_rate
      - coolant_pressure
      - pump_speed_or_state
      - valve_position_or_state
      - cooling_alarm_state
      - fan_speed_rpm_or_percent
      - airflow_rate
      - thermal_control_mode
      - source_reported_airflow_state
      - outdoor_air_temperature_celsius
      - outdoor_humidity_percent
      - hvac_control_mode
      - economizer_state
      - facility_temperature_setpoint_celsius
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - accelerator_busy_or_utilization_fraction
    derived_signals:
      - sustained_accelerator_activity_window
      - cap_clock_power_factor
    time_alignment: "Normalize physical channels for thermal lag, control mode, ambient conditions, and scope mapping."
    logic: >
      Baseline-subtracted power, heat, fan, flow, and temperature responses
      support that substantial infrastructure load occurred. These channels
      validate or challenge activity evidence but do not classify the workload.
    trigger:
      type: physical_support_threshold_logic
      evaluation_window: lag_adjusted_activity_window
      portability: moderate
      source_refs: [S07, S08, S09, S40, S41]
      conditions:
        all:
          - metric: physical_load_score
            op: ">="
            value_ref: min_physical_load_score
          - metric: lag_adjusted_overlap
            op: ">="
            value_ref: min_lag_adjusted_overlap_fraction
          - metric: physical_channel_coverage_fraction
            op: ">="
            value_ref: min_physical_channel_coverage_fraction
        none:
          - metric: cooling_alarm_or_maintenance_explanation_score
            op: ">="
            value_ref: physical_explanation_suppression_score
      scoring:
        physical_support_score: "clamp(0.50 * physical_load_score + 0.30 * lag_adjusted_overlap + 0.20 * thermal_response_score, 0, 1)"
      score_effect:
        training_core_confidence_delta: 1
        applies_when_score_gte: 0.70
        explanation_priority: low
      calibration_defaults:
        - name: min_physical_load_score
          value: 0.60
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Physical support should show material baseline-subtracted load, normalized to scope capacity."
          counterevidence_or_failure_modes: ["CPU/storage loads, mixed tenants, and cooling faults can raise physical load"]
          calibration_note: "Replace with local rack/device power and cooling baselines."
        - name: min_lag_adjusted_overlap_fraction
          value: 0.60
          unit: fraction
          evidence_status: calibration_default
          rationale: "Thermal and cooling responses lag compute; overlap must be lag-adjusted."
          counterevidence_or_failure_modes: ["thermal inertia and control policy can obscure overlap"]
          calibration_note: "Calibrate lag by cooling design and telemetry interval."
        - name: min_physical_channel_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          rationale: "Power and cooling telemetry must cover most of the candidate window."
          counterevidence_or_failure_modes: ["DCIM/BMS sampling can be sparse or scope-mismatched"]
          calibration_note: "Replace with source-specific coverage."
        - name: physical_explanation_suppression_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Known cooling faults or maintenance can explain physical changes without supporting workload identity."
          counterevidence_or_failure_modes: ["maintenance can overlap real training"]
          calibration_note: "Tune with maintenance and alarm records."
    output_fields:
      - physical_load_support
      - lag_adjusted_overlap
      - thermal_or_cooling_explanations
      - confidence
    confidence_label: likely
    source_refs: [S07, S08, S09, S40, S41]

  - id: lifecycle_preemption_context
    purpose: supportive_operational_context
    required_features:
      - resource_container_lifecycle_events
    optional_features:
      - allocation_preemption_events
      - compute_running_intervals
      - allocated_accelerator_count_by_sku
      - storage_write_operation_bytes
      - object_storage_operation_counts
      - container_resource_usage_quantity
      - maintenance_operation_intervals
    derived_signals:
      - checkpoint_periodicity_score
      - clock_aligned_overlap_window
    time_alignment: "Lifecycle and preemption events affect only overlapping or immediately adjacent candidate windows."
    logic: >
      Start, restart, failure, and preemption events bound job windows and can
      explain checkpoint bursts, fragmented activity, and gaps. They are
      supportive only when workload-shape evidence exists.
    output_fields:
      - lifecycle_context_label
      - affected_window
      - restart_or_preemption_count
      - checkpoint_relation
      - caveats
    confidence_label: likely
    source_refs: [S18, S21, S22, S38]

  - id: topology_training_context
    purpose: supportive_topology_context
    required_features:
      - scaleout_fabric_domain_graph
    optional_features:
      - local_accelerator_interconnect_domain
      - cross_site_or_dci_connectivity
      - topology_change_events
      - fabric_port_device_sample_counters
      - rdma_congestion_retry_drop_error_counters
      - scaleout_port_tx_rx_bytes_packets
      - local_interconnect_tx_rx_bytes
    derived_signals:
      - largest_usable_topology_domain
      - stable_participant_set
    time_alignment: "Use the topology state active during the candidate fabric/activity window."
    logic: >
      A coherent low-latency topology strengthens plausibility of distributed
      training when core evidence is present. Topology capability alone remains
      capacity/support, not training identity.
    trigger:
      type: topology_support_threshold_logic
      evaluation_window: candidate_fabric_activity_window
      portability: moderate
      source_refs: [S11, S15, S16, S17, S25, S42, S43]
      conditions:
        all:
          - metric: largest_usable_topology_domain.domain_accelerator_count
            op: ">="
            value_ref: min_domain_accelerator_count
          - metric: largest_usable_topology_domain.topology_support_score
            op: ">="
            value_ref: min_topology_support_score
          - metric: topology_mapping_coverage_fraction
            op: ">="
            value_ref: min_topology_mapping_coverage_fraction
        none:
          - metric: route_or_topology_change_overlap_fraction
            op: ">="
            value_ref: route_change_suppression_overlap_fraction
      scoring:
        topology_training_support_score: "clamp(0.45 * topology_support_score + 0.35 * participant_fit_score + 0.20 * topology_mapping_coverage_fraction, 0, 1)"
      score_effect:
        training_core_confidence_delta: 1
        applies_when_score_gte: 0.70
        explanation_priority: medium
      calibration_defaults:
        - name: min_domain_accelerator_count
          value: 16
          unit: accelerators
          evidence_status: calibration_default
          rationale: "Coherent multi-node topology is supportive only when it can host a material participant set."
          counterevidence_or_failure_modes: ["smaller training jobs can be real", "large HPC domains can pass"]
          calibration_note: "Calibrate by local training and HPC topology footprints."
        - name: min_topology_support_score
          value: 0.65
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Requires useful domain size, fabric health, and mapping coverage."
          counterevidence_or_failure_modes: ["topology health supports possibility, not identity"]
          calibration_note: "Tune by fabric generation and topology telemetry."
        - name: min_topology_mapping_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          rationale: "Topology support requires mapped devices, ports, or instances for most of the window."
          counterevidence_or_failure_modes: ["port-to-job mapping gaps can lower true support"]
          calibration_note: "Replace with topology inventory and fabric telemetry coverage."
        - name: route_change_suppression_overlap_fraction
          value: 0.50
          unit: fraction
          evidence_status: calibration_default
          rationale: "Large route/topology changes during candidate windows can invalidate support."
          counterevidence_or_failure_modes: ["planned expansion can coexist with real training"]
          calibration_note: "Tune by network maintenance and route-change semantics."
    output_fields:
      - topology_support_label
      - largest_domain_accelerator_count
      - fabric_class
      - topology_caveats
    confidence_label: likely
    source_refs: [S11, S15, S16, S17, S25, S42, S43]

  - id: partition_shape_context
    purpose: supportive_or_counterevidence_context
    required_features:
      - accelerator_partitioning_intervals
    optional_features:
      - allocated_accelerator_count_by_sku
      - container_resource_request_quantity
      - container_resource_limit_quantity
      - hbm_or_device_memory_used
      - scaleout_port_tx_rx_bytes_packets
    derived_signals:
      - available_accelerator_fraction
    time_alignment: "Evaluate partition shape over the same allocation and activity window."
    logic: >
      Full-device or large coherent partitions support large synchronized
      training plausibility. Many small MIG/vGPU slices weaken a single-run
      interpretation unless the hypothesis is multi-tenant fine-tuning or
      many-shard model development.
    output_fields:
      - partition_support_label
      - partition_profile_summary
      - single_large_run_plausibility
      - caveats
    confidence_label: likely
    source_refs: [S10, S19, S20]

  - id: cache_epoch_support
    purpose: weak_supportive_data_pattern
    required_features:
      - cache_hit_miss_counters
    optional_features:
      - storage_read_operation_bytes
      - filesystem_throughput_metadata_ops
      - object_storage_operation_counts
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - compute_running_intervals
    derived_signals:
      - storage_staging_window
    time_alignment: "Compare cache curves to repeated data-read and accelerator activity windows."
    logic: >
      Increasing hit rates after initial staging can weakly support repeated
      dataset passes. High misses during GPU activity can explain input
      bottlenecks. This remains weak because cache behavior is highly workload
      and tenant dependent.
    output_fields:
      - cache_support_label
      - hit_rate_curve
      - relation_to_activity_window
      - caveats
    confidence_label: project_assumption
    source_refs: [S33, S34, S35]

  - id: serving_heavy_network_counterevidence
    purpose: false_positive_filter
    required_features:
      - load_balancer_gateway_flow_activity
    optional_features:
      - north_south_external_egress
      - vpc_or_nsg_flow_records
      - east_west_internal_flow_bytes
      - container_resource_usage_quantity
      - storage_read_operation_bytes
      - storage_write_operation_bytes
    derived_signals:
      - non_serving_score
    time_alignment: "Compare serving-like network shape to the same high accelerator activity window."
    logic: >
      High external connection counts, request fan-in/fan-out, or response-like
      egress during high tensor activity can indicate inference or serving
      rather than training. Low serving signals strengthen non-serving
      interpretations but do not prove training.
    trigger:
      type: counterevidence_threshold_logic
      evaluation_window: high_activity_window
      portability: moderate
      source_refs: [S27, S28, S29, S30, S34]
      conditions:
        all:
          - metric: non_serving_score.serving_counterevidence_score
            op: ">="
            value_ref: min_serving_counterevidence_score
          - metric: serving_activity_overlap_fraction
            op: ">="
            value_ref: min_serving_activity_overlap_fraction
          - metric: serving_channel_coverage_fraction
            op: ">="
            value_ref: min_serving_channel_coverage_fraction
        any:
          - metric: non_serving_score.gateway_connection_rate_score
            op: ">="
            value_ref: min_gateway_connection_rate_score
          - metric: non_serving_score.request_response_shape_score
            op: ">="
            value_ref: min_request_response_shape_score
          - metric: non_serving_score.external_egress_response_score
            op: ">="
            value_ref: min_external_egress_response_score
      score_effect:
        training_core_confidence_delta: -1
        explanation_priority: high
        suppresses_rules:
          - collective_cadence_training
          - sustained_ml_compute_nonserving
          - achieved_ops_training_candidate
        suppresses_confidence_at_or_above: medium
      calibration_defaults:
        - name: min_serving_counterevidence_score
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "High normalized serving-shape score should weaken training interpretations."
          counterevidence_or_failure_modes: ["artifact export, dataset fetches, and shared gateways can resemble serving"]
          calibration_note: "Replace with local inference/serving and training network traces."
        - name: min_serving_activity_overlap_fraction
          value: 0.50
          unit: fraction
          evidence_status: calibration_default
          rationale: "Serving counterevidence should overlap the high-compute candidate window."
          counterevidence_or_failure_modes: ["coarse flow logs can overstate overlap"]
          calibration_note: "Tune by flow aggregation interval and clock alignment."
        - name: min_serving_channel_coverage_fraction
          value: 0.80
          unit: fraction
          evidence_status: source_informed
          rationale: "Serving-shape absence or presence requires adequate flow/gateway coverage."
          counterevidence_or_failure_modes: ["sampled or disabled flow logs can miss serving traffic"]
          calibration_note: "Replace with source sampling and coverage settings."
        - name: min_gateway_connection_rate_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "High gateway connection rate during compute is a serving-like signal."
          counterevidence_or_failure_modes: ["data ingestion and service-mesh traffic can inflate connection rate"]
          calibration_note: "Calibrate by local gateway baselines."
        - name: min_request_response_shape_score
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Request/response-like flow shape distinguishes serving from many offline jobs."
          counterevidence_or_failure_modes: ["batch APIs and synthetic data pipelines may mimic request/response"]
          calibration_note: "Tune by service architecture and batch workflow traces."
        - name: min_external_egress_response_score
          value: 0.70
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "High response-like external egress during accelerator activity weakens training identity."
          counterevidence_or_failure_modes: ["artifact exports can look like egress responses"]
          calibration_note: "Calibrate against known exports and serving windows."
    output_fields:
      - serving_counterevidence_label
      - gateway_connection_rate
      - external_egress_bytes
      - non_serving_score
      - exceptions
    confidence_label: likely
    source_refs: [S27, S28, S29, S30, S34]

  - id: benchmark_like_collective_counterevidence
    purpose: false_positive_filter
    required_features:
      - scaleout_port_tx_rx_bytes_packets
    optional_features:
      - local_interconnect_tx_rx_bytes
      - fabric_port_device_sample_counters
      - rdma_congestion_retry_drop_error_counters
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - accelerator_busy_or_utilization_fraction
      - allocated_accelerator_count_by_sku
      - compute_running_intervals
      - container_resource_usage_quantity
      - storage_write_operation_bytes
      - object_storage_operation_counts
    derived_signals:
      - collective_cadence_score
      - fabric_compute_time_alignment
      - checkpoint_periodicity_score
    time_alignment: "Check benchmark alternatives within the same participant set and fabric window."
    logic: >
      Very regular fabric bursts, limited storage/checkpoint evidence, short
      duration, or low trainable-state lifecycle support can indicate NCCL/MPI
      tests or burn-in rather than training. Suppress strong labels unless other
      identity evidence remains.
    trigger:
      type: counterevidence_threshold_logic
      evaluation_window: candidate_fabric_activity_window
      portability: moderate
      source_refs: [S11, S15, S16, S17, S25]
      conditions:
        all:
          - metric: collective_cadence_score.cadence_score
            op: ">="
            value_ref: min_collective_similarity_score
          - metric: benchmark_regularity_score
            op: ">="
            value_ref: min_benchmark_regularity_score
          - metric: benchmark_duration_seconds
            op: "<="
            value_ref: max_benchmark_like_duration_seconds
          - metric: checkpoint_periodicity_score.periodicity_score
            op: "<="
            value_ref: max_checkpoint_support_score_for_benchmark
        any:
          - metric: container_command_or_image_benchmark_score
            op: ">="
            value_ref: min_declared_benchmark_score
          - metric: collective_cadence_score.normalized_fabric_burst_score
            op: ">="
            value_ref: min_benchmark_fabric_burst_score
      score_effect:
        training_core_confidence_delta: -1
        explanation_priority: high
        suppresses_rules:
          - collective_cadence_training
          - achieved_ops_training_candidate
        suppresses_confidence_at_or_above: strong
      calibration_defaults:
        - name: min_collective_similarity_score
          value: 0.75
          unit: score_0_to_1
          evidence_status: mechanism_inferred
          rationale: "Benchmarks can be collective-heavy; high collective similarity is counterevidence when training lifecycle support is absent."
          counterevidence_or_failure_modes: ["short training tests can look benchmark-like"]
          calibration_note: "Calibrate with local NCCL/MPI benchmark and confirmed training traces."
        - name: min_benchmark_regularity_score
          value: 0.90
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Synthetic communication tests are often more regular than full training traces."
          counterevidence_or_failure_modes: ["some training steps can be very regular"]
          calibration_note: "Tune by benchmark suite and model family."
        - name: max_benchmark_like_duration_seconds
          value: 7200
          unit: seconds
          evidence_status: calibration_default
          rationale: "Short high-regularity fabric tests are more likely benchmarks or burn-in than large training."
          counterevidence_or_failure_modes: ["long benchmarks and short fine-tunes exist"]
          calibration_note: "Replace with local benchmark/burn-in duration distributions."
        - name: max_checkpoint_support_score_for_benchmark
          value: 0.25
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Benchmark alternative is stronger when checkpoint-like support is absent."
          counterevidence_or_failure_modes: ["training without visible checkpoints can be real"]
          calibration_note: "Tune by framework checkpoint visibility."
        - name: min_declared_benchmark_score
          value: 0.70
          unit: score_0_to_1
          evidence_status: project_assumption
          rationale: "Container command/image/runtime hints can strengthen benchmark explanation without relying on client semantics alone."
          counterevidence_or_failure_modes: ["names can be misleading or unavailable"]
          calibration_note: "Use only infrastructure-visible metadata allowed by the monitoring regime."
        - name: min_benchmark_fabric_burst_score
          value: 0.80
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "High normalized fabric bursts with little checkpoint/lifecycle support are benchmark-like."
          counterevidence_or_failure_modes: ["large distributed training can also have high normalized bursts"]
          calibration_note: "Calibrate by fabric generation and benchmark suite."
    output_fields:
      - benchmark_counterevidence_label
      - regularity_score
      - duration_seconds
      - checkpoint_absence
      - residual_training_support
    confidence_label: likely
    source_refs: [S11, S15, S16, S17, S25]

  - id: storage_rebuild_backup_explanation
    purpose: false_positive_filter
    required_features:
      - storage_operation_intervals
    optional_features:
      - storage_read_operation_bytes
      - storage_write_operation_bytes
      - filesystem_throughput_metadata_ops
      - object_storage_operation_counts
      - object_or_file_copy_movement_records
      - east_west_internal_flow_bytes
      - data_center_interconnect_wan_usage
      - scaleout_port_tx_rx_bytes_packets
    derived_signals:
      - storage_staging_window
      - checkpoint_size_consistency
    time_alignment: "Storage-operation intervals must overlap the suspicious storage/fabric activity they explain."
    logic: >
      Backup, restore, rebuild, replication, migration, or disaster-recovery
      records can explain high storage writes, reads, metadata storms, internal
      flows, or WAN traffic that otherwise look like checkpointing or staging.
    trigger:
      type: explanation_threshold_logic
      evaluation_window: suspicious_storage_or_fabric_window
      portability: strong
      source_refs: [S31, S32, S33, S34, S35]
      conditions:
        all:
          - metric: storage_operation_intervals.operation_type
            op: in
            value_ref: explanatory_storage_operation_types
          - metric: storage_operation_overlap_fraction
            op: ">="
            value_ref: min_storage_operation_overlap_fraction
          - metric: bytes_explained_fraction
            op: ">="
            value_ref: min_bytes_explained_fraction
        any:
          - metric: storage_staging_window.normalized_staging_score
            op: ">="
            value_ref: min_storage_activity_score
          - metric: high_fabric_or_internal_flow_score
            op: ">="
            value_ref: min_fabric_activity_score
      score_effect:
        training_core_confidence_delta: -1
        explanation_priority: high
        suppresses_rules:
          - checkpoint_training_signature
          - storage_staging_support
          - collective_cadence_training
        suppresses_confidence_at_or_above: medium
      calibration_defaults:
        - name: explanatory_storage_operation_types
          value: [backup, restore, rebuild, replication, migration, disaster_recovery, snapshot, etl_export]
          unit: categorical_set
          evidence_status: source_informed
          rationale: "Explicit operation labels are direct explanations for storage and internal-network movement."
          counterevidence_or_failure_modes: ["operation labels can be broad and overlap real training"]
          calibration_note: "Normalize local operation labels to this set."
        - name: min_storage_operation_overlap_fraction
          value: 0.80
          unit: fraction
          evidence_status: calibration_default
          rationale: "Operation interval should cover most suspicious activity to explain it."
          counterevidence_or_failure_modes: ["coarse operation intervals can over-explain unrelated activity"]
          calibration_note: "Calibrate with operation start/end accuracy."
        - name: min_bytes_explained_fraction
          value: 0.70
          unit: fraction
          evidence_status: calibration_default
          rationale: "Most bytes should be attributable to the benign storage operation before suppressing training evidence."
          counterevidence_or_failure_modes: ["byte attribution can be approximate on shared storage"]
          calibration_note: "Replace with storage accounting or object movement records."
        - name: min_storage_activity_score
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Only material storage activity should be explained by this support rule."
          counterevidence_or_failure_modes: ["small but training-critical checkpoints can be below this"]
          calibration_note: "Tune by local storage baselines."
        - name: min_fabric_activity_score
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "Storage explanation can also apply to fabric/internal flow bursts."
          counterevidence_or_failure_modes: ["accelerator collectives can coexist with storage traffic"]
          calibration_note: "Calibrate by network segmentation and storage-fabric routes."
    output_fields:
      - storage_explanation_label
      - operation_type
      - bytes_moved
      - explained_activity_channels
      - unexplained_residual
    confidence_label: likely
    source_refs: [S31, S32, S33, S34, S35]

  - id: hpc_mpi_collective_alternative
    purpose: false_positive_filter
    required_features:
      - scaleout_port_tx_rx_bytes_packets
    optional_features:
      - local_interconnect_tx_rx_bytes
      - fabric_port_device_sample_counters
      - rdma_congestion_retry_drop_error_counters
      - tensor_matrix_mxu_neuron_or_engine_active_fraction
      - generic_achieved_operation_rate
      - accelerator_busy_or_utilization_fraction
      - allocated_accelerator_count_by_sku
      - compute_running_intervals
      - storage_write_operation_bytes
      - object_storage_operation_counts
      - load_balancer_gateway_flow_activity
    derived_signals:
      - collective_cadence_score
      - fabric_compute_time_alignment
      - non_serving_score
    time_alignment: "Evaluate HPC/MPI alternatives over the same fabric, compute, and allocation window."
    logic: >
      HPC simulations and MPI collectives can produce stable participant sets,
      high accelerator activity, and collective-like traffic. Require checkpoint
      or model-development support before promoting a fabric-heavy candidate to
      strong training evidence.
    trigger:
      type: counterevidence_threshold_logic
      evaluation_window: candidate_fabric_activity_window
      portability: weak
      source_refs: [S11, S15, S16, S17, S25]
      conditions:
        all:
          - metric: hpc_collective_similarity_score
            op: ">="
            value_ref: min_hpc_collective_similarity_score
          - metric: collective_cadence_score.cadence_score
            op: ">="
            value_ref: min_collective_cadence_for_hpc_alternative
          - metric: non_serving_score.non_serving_score
            op: ">="
            value_ref: min_non_serving_score_for_hpc_alternative
          - metric: checkpoint_periodicity_score.periodicity_score
            op: "<="
            value_ref: max_checkpoint_support_score_for_hpc_alternative
        any:
          - metric: domain_runtime_or_queue_hpc_score
            op: ">="
            value_ref: min_hpc_context_score
          - metric: fabric_compute_time_alignment.overlap_fraction
            op: ">="
            value_ref: min_hpc_fabric_compute_overlap_fraction
      score_effect:
        training_core_confidence_delta: -1
        explanation_priority: medium
        suppresses_rules:
          - collective_cadence_training
        suppresses_confidence_at_or_above: strong
      calibration_defaults:
        - name: min_hpc_collective_similarity_score
          value: 0.70
          unit: score_0_to_1
          evidence_status: mechanism_inferred
          rationale: "HPC/MPI alternatives can share stable participants, collectives, and high compute."
          counterevidence_or_failure_modes: ["model training and HPC traces can be difficult to separate without logs or artifacts"]
          calibration_note: "Calibrate with local HPC/MPI and training traces."
        - name: min_collective_cadence_for_hpc_alternative
          value: 0.65
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "HPC alternative should have collective-like behavior over the same window."
          counterevidence_or_failure_modes: ["some HPC jobs are not collective-heavy"]
          calibration_note: "Tune by local HPC workload mix."
        - name: min_non_serving_score_for_hpc_alternative
          value: 0.50
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "HPC jobs often look non-serving, so non-serving shape alone should not promote training."
          counterevidence_or_failure_modes: ["offline training also looks non-serving"]
          calibration_note: "Calibrate with non-serving workload classes."
        - name: max_checkpoint_support_score_for_hpc_alternative
          value: 0.30
          unit: score_0_to_1
          evidence_status: calibration_default
          rationale: "HPC explanation is stronger when checkpoint/model-state support is weak."
          counterevidence_or_failure_modes: ["HPC also checkpoints; training can lack visible checkpoints"]
          calibration_note: "Tune with domain checkpoint behavior."
        - name: min_hpc_context_score
          value: 0.60
          unit: score_0_to_1
          evidence_status: project_assumption
          rationale: "Infrastructure-visible queue, image, account, or container context can support HPC alternative without depending on client semantic labels alone."
          counterevidence_or_failure_modes: ["metadata can be absent or ambiguous"]
          calibration_note: "Use only context fields allowed by monitoring policy."
        - name: min_hpc_fabric_compute_overlap_fraction
          value: 0.60
          unit: fraction
          evidence_status: calibration_default
          rationale: "HPC collective alternatives should align fabric and compute activity."
          counterevidence_or_failure_modes: ["distributed training also aligns fabric and compute"]
          calibration_note: "Calibrate by workload trace library."
    output_fields:
      - hpc_alternative_label
      - collective_similarity
      - missing_training_support
      - review_reason
    confidence_label: likely
    source_refs: [S11, S15, S16, S17, S25]
