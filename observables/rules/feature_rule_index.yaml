schema_version: "0.1"
created: "2026-05-16"
source_inventory: observables/observables.yaml
status: study_algorithm_rule_spec

aggregation_index_policy:
  aggregation_file: observables/rules/aggregation_rules.yaml
  relationship_to_raw_feature_index: >
    Aggregation rules consume sparse rule categories, labels, and derived
    signals rather than raw features. They are therefore not repeated under
    every raw feature entry in this file. Raw feature entries continue to map to
    the active sparse support, discrepancy, capacity, core, and derived-signal rules
    that interpret source-emitted values directly.
  aggregation_rule_ids:
    - capacity_gate_segment_ruleout
    - capacity_gate_live_segment_classification
    - large_compute_candidate_routing
    - distributed_training_like_candidate_promotion
    - checkpoint_training_like_candidate_promotion
    - sparse_large_compute_training_like_candidate_promotion
    - support_context_aggregation
    - suppressor_and_explanation_aggregation
    - discrepancy_targeted_escalation
    - no_training_candidate_coverage_gate
    - final_algorithm_claim_routing

feature_rule_index:
